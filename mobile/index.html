<title>시선사이 모바일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="siseon-mobile-version" content="siseon-mobile-v1.4-20261119">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 시선사이 · 공동관찰 입체방 */
.rs-root {
  position: relative;
  overflow: hidden;
  touch-action: none;               /* 스크롤·확대 대신 터치를 그림에 전달 */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.rs-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: default;                  /* 호버로 장난감을 드러내지 않도록 커서 변화 없음 */
  outline: none;
}
.rs-sr {                            /* 화면낭독기 전용, 화면에는 보이지 않음 */
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}
.rs-root.rs-error::after {
  content: attr(data-error);
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font: 600 16px/1.5 system-ui, sans-serif;
  color: #7a4a2a;
}
.rs-debug {
  position: absolute; left: 12px; bottom: 12px;
  padding: 6px 10px; border-radius: 8px;
  background: rgba(0,0,0,.65); color: #fff;
  font: 600 13px/1.3 ui-monospace, Menlo, monospace;
  pointer-events: none;
}
.rs-gl { pointer-events: none; transition: opacity .2s linear; }
.rs-fx { z-index: 1; }
/* 효과음 켜기/끄기 — 그림 밖 모서리에 작게, 장난감과 겹치지 않음 */
.rs-sound {
  position: absolute; z-index: 2;
  top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid rgba(122,74,42,.18);
  background: rgba(255,248,236,.72);
  color: #7a4a2a;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  box-shadow: 0 2px 8px rgba(90,60,30,.15);
  cursor: pointer; padding: 0;
  touch-action: manipulation;
}
.rs-sound .rs-off { display: none; }
.rs-sound.is-off .rs-on { display: none; }
.rs-sound.is-off .rs-off { display: inline; }
.rs-sound:focus-visible { outline: 3px solid #7fb8f0; outline-offset: 2px; }

/* 시선사이 · 정리 친구의 가족 미션 시범 — every rule is scoped to .smm-* inside the host */
.smm-root {
  --smm-ink: #5b3a24;
  --smm-paper: #fbf4e8;
  --smm-card: #fffaf2;
  --smm-line: #e3cfb3;
  --smm-wood: #c98c52;
  --smm-child: #ff8c5a;
  --smm-family: #6fa86b;
  --smm-font: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  container-type: inline-size;
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: var(--smm-ink);
  font-family: var(--smm-font);
  -webkit-user-select: none;
  user-select: none;
}
.smm-root *, .smm-root *::before, .smm-root *::after { box-sizing: border-box; }

.smm-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}
.smm-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 4px 12px 4px 4px;
  background: var(--smm-card);
  border: 2px solid var(--smm-line);
  border-radius: 999px;
  font-size: clamp(14px, 2.6cqw, 18px);
  line-height: 1.2;
}
.smm-tag-code {
  padding: 2px 10px;
  border-radius: 999px;
  background: #fbefe0;
  border: 2px solid #c9a27a;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.smm-tag-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.smm-step {
  padding: 4px 12px;
  border-radius: 999px;
  background: #f1e3cd;
  font-size: clamp(13px, 2.4cqw, 16px);
  white-space: nowrap;
}
.smm-step.smm-role-child { background: #ffe3d4; color: #a6431c; }
.smm-step.smm-role-family { background: #e1f0dc; color: #3f6b3c; }

.smm-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  max-width: 100%;
  border-radius: 20px;
  overflow: hidden;
  background: var(--smm-paper);
  box-shadow: inset 0 0 0 2px var(--smm-line);
}
.smm-root.smm-portrait .smm-stage { aspect-ratio: 1 / 1; }
.smm-svg { display: block; width: 100%; height: 100%; }

.smm-caption {
  margin: 0;
  min-height: 2.7em;
  padding: 8px 14px;
  border-radius: 16px;
  background: var(--smm-card);
  border: 2px solid var(--smm-line);
  font-size: clamp(17px, 3.6cqw, 26px);
  line-height: 1.32;
  text-align: center;
  text-wrap: balance;
  word-break: keep-all;
  display: flex;
  align-items: center;
  justify-content: center;
}
.smm-caption.smm-k-title { font-size: clamp(19px, 4.2cqw, 30px); color: #8a4a22; }
.smm-caption.smm-k-done { color: #a6431c; }

/* reduced motion: each step is a still frame; a soft fade marks the change */
.smm-root.smm-flip .smm-svg { animation: smm-fade 0.5s ease-out; }
@keyframes smm-fade { from { opacity: 0.25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .smm-root.smm-flip .smm-svg { animation-duration: 0.01s; }
}

/* 시선사이 모바일 — 동화책 한 권을 폰 한 대로 넘겨요.
   Layout: 위 얇은 책머리(로고·역할·쪽수) / 가운데 책장 / 아래 엄지 자리 고정 버튼 */
:root {
  --bg: #FBF4E8;          /* 시작 화면 배경 (지정 색) */
  --card: #FFFDF8;        /* 카드·하단바 */
  --line: #E4D6BF;        /* 테두리 */
  --ink: #2A2622;         /* 본문 */
  --sub: #5E5348;         /* 보조 글자 */
  --child: #2E5B92;       /* 아이 책 · 시작 버튼 */
  --child-soft: #E3EAF4;
  --adult: #7A4F2A;       /* 부모님 책 */
  --adult-soft: #F2E6D6;
  --paw: #9A6B43;         /* 발바닥 */
  --paw-dark: #6E4A2C;
  --paw-pad: #F4C7B5;
  --honey: #F3D9A6;
  --ok: #3D7552;
  --warn: #A1462A;
  --font-title: "Hippie", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;   /* 제목만 손글씨 (히피체) */
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;   /* 본문은 깔끔하게, 기본 500 */
  --bar-h: 92px;
  --head-h: 52px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 17px/1.65 var(--font-body);
  -webkit-text-size-adjust: 100%;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
/* 아르떼 종이 결 */
body::after {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  opacity: .5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .33  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--child); outline-offset: 3px; border-radius: 10px; }
img { max-width: 100%; }
.art { filter: saturate(.86) brightness(1.03) contrast(.97) sepia(.04); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- 책머리 ---------- */
.head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--head-h);
  display: flex; align-items: center; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.logo {
  border: 0; background: none; padding: 6px 4px; min-height: 44px;
  font: 400 25px/1 var(--font-title); color: var(--ink);
}
.head .spacer { flex: 1; }
.role-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 14px; font-weight: 700; }
.role-tag.child { background: var(--child-soft); color: var(--child); }
.role-tag.adult { background: var(--adult-soft); color: var(--adult); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card);
  display: inline-grid; place-items: center; color: var(--sub);
}
.icon-btn { padding: 0; flex: none; line-height: 0; }
.icon-btn svg { width: 22px; height: 22px; display: block; flex: none; margin: 0 0 0 1px; }   /* 스피커 모양은 오른쪽 물결 때문에 1px 오른쪽이 눈으로 가운데예요 */

/* ---------- 책장 ---------- */
.stage { position: relative; z-index: 1; perspective: 1400px; }
.page {
  min-height: calc(100dvh - var(--head-h) - env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom, 0px));
  max-width: 640px; margin: 0 auto;
  transform-origin: left center;
  backface-visibility: hidden;
}
.page.no-head { min-height: 100dvh; padding-top: 0; }
/* 책장 넘김: 지난 쪽이 종이처럼 들려 넘어가고, 새 쪽 위로 그림자가 지나가요 */
.leaf {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--head-h) + env(safe-area-inset-top, 0px));
  z-index: 24; overflow: hidden; pointer-events: none;
  background: var(--bg);
  transform-origin: left center; backface-visibility: hidden;
  box-shadow: 0 0 0 1px rgba(120,90,55,.08);
  will-change: transform;
}
.leaf.from-home { top: 0; }
.leaf > .page { min-height: 0; }
.leaf::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(255,255,255,0) 30%, rgba(255,250,240,.55) 62%, rgba(110,80,45,.28) 100%); opacity: 0; }
.leaf.next { animation: leafNext .78s cubic-bezier(.5,.05,.35,1) forwards; }
.leaf.next::after { animation: leafLight .78s ease-in forwards; }
.leaf.back { transform-origin: right center; animation: leafBack .78s cubic-bezier(.5,.05,.35,1) forwards; }
.leaf.back::after { background: linear-gradient(270deg, rgba(255,255,255,0) 30%, rgba(255,250,240,.55) 62%, rgba(110,80,45,.28) 100%); animation: leafLight .78s ease-in forwards; }
@keyframes leafNext {
  0% { transform: perspective(1500px) rotateY(0) skewY(0); }
  35% { transform: perspective(1500px) rotateY(-28deg) skewY(-1.5deg); }
  100% { transform: perspective(1500px) rotateY(-108deg) skewY(-3deg); }
}
@keyframes leafBack {
  0% { transform: perspective(1500px) rotateY(0) skewY(0); }
  35% { transform: perspective(1500px) rotateY(28deg) skewY(1.5deg); }
  100% { transform: perspective(1500px) rotateY(108deg) skewY(3deg); }
}
@keyframes leafLight { 0% { opacity: 0; } 40% { opacity: .9; } 100% { opacity: 1; } }
.turn-shade { position: fixed; inset: 0; z-index: 23; pointer-events: none; background: linear-gradient(90deg, rgba(90,64,36,.22), rgba(90,64,36,0) 70%); animation: shade .78s ease-out forwards; }
.turn-shade.back { background: linear-gradient(270deg, rgba(90,64,36,.22), rgba(90,64,36,0) 70%); }
@keyframes shade { 0% { opacity: 1; } 100% { opacity: 0; } }
.page.settle { animation: settle .5s .18s ease-out both; }
@keyframes settle { from { transform: translateY(6px); } to { transform: none; } }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.title { font: 400 clamp(36px, 10vw, 46px)/1.18 var(--font-title); letter-spacing: 0; }
.title .blue { color: var(--child); }
.h2 { font: 400 clamp(27px, 7.4vw, 33px)/1.3 var(--font-title); }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--child); letter-spacing: .02em; }
.adult .eyebrow { color: var(--adult); }
.lead { margin: 0; font-size: 17px; font-weight: 500; color: var(--sub); }
.lead b, .note b, p b { font-weight: 700; color: var(--ink); }
.small { font-size: 14px; color: var(--sub); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 500; box-shadow: 0 2px 0 var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.note { font-size: 14px; color: var(--sub); background: color-mix(in srgb, var(--honey) 35%, var(--card)); border-radius: 14px; padding: 12px 14px; }
.note b { color: var(--ink); }

/* ---------- 시작 화면 (A안) ---------- */
.cover { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))); position: relative; }
.cover video, .cover img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; max-height: 50dvh; object-fit: cover; object-position: 40% 50%; border-radius: 0 0 28px 28px; background: #efe3cf; }
.cover-body { padding-top: 22px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- 하단 엄지 바 ---------- */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--card);
  border-top: 1px solid #E8DCC8;
  box-shadow: 0 -10px 24px rgba(42,38,34,.06);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.bar-row { display: flex; gap: 10px; align-items: center; }
.bar-hint { text-align: center; font-size: 14px; color: var(--sub); min-height: 1.2em; }
.bar-hint.err { color: var(--warn); font-weight: 600; }
body.typing .bar { position: static; box-shadow: none; }
body.typing .page { padding-bottom: 24px; }

/* 입체 버튼: 아래쪽 두께(그림자 띠)가 있고, 누르면 그만큼 눌려 들어가요 */
.btn-main {
  position: relative; flex: 1; min-height: 64px; border: 0; border-radius: 20px;
  background: linear-gradient(180deg, #3A6BA6, var(--child)); color: #fff;
  font-size: 19px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 7px 0 #1E3F68, 0 14px 22px rgba(46,91,146,.3), inset 0 2px 0 rgba(255,255,255,.28);
  transition: transform .07s, box-shadow .07s;
  touch-action: manipulation;
}
.btn-main:active, .btn-main.pressed { transform: translateY(6px); box-shadow: 0 1px 0 #1E3F68, 0 4px 8px rgba(46,91,146,.25), inset 0 2px 4px rgba(0,0,0,.18); }
.btn-main svg { width: 26px; height: 26px; flex: none; }
.btn-soft { min-height: 48px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; padding: 8px 16px; color: var(--ink); box-shadow: 0 4px 0 var(--line); transition: transform .07s, box-shadow .07s; touch-action: manipulation; }
.btn-soft:active, .btn-soft.pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn-text { min-height: 44px; border: 0; background: none; color: var(--child); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 8px; }
button:disabled { opacity: .45; cursor: not-allowed; box-shadow: 0 3px 0 rgba(0,0,0,.08) !important; transform: none !important; }
button:disabled * { animation: none !important; }

/* ---------- 토끼 발바닥 버튼: 앞으로는 오른쪽, 뒤로는 왼쪽 ---------- */
.paw-next {
  position: relative; overflow: visible; flex: 1; min-height: 68px; border: 0; border-radius: 999px;
  padding: 0 8px 0 26px;
  background: linear-gradient(180deg, #B98758 0%, var(--paw) 60%, #8C5F3A 100%);
  color: #fff; font-size: 19px; font-weight: 700; letter-spacing: .01em;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  box-shadow: 0 8px 0 var(--paw-dark), 0 15px 22px rgba(110,74,44,.32), inset 0 2px 0 rgba(255,255,255,.3);
  transition: transform .07s, box-shadow .07s;
  touch-action: manipulation; isolation: isolate;
}
.paw-next .label { flex: 1; text-align: center; text-shadow: 0 1px 0 rgba(80,50,25,.35); }
.paw-next:active, .paw-next.pressed { transform: translateY(7px); box-shadow: 0 1px 0 var(--paw-dark), 0 4px 8px rgba(110,74,44,.25), inset 0 3px 6px rgba(60,35,15,.3); }
.paw-next::after { /* 반짝이는 빛줄기 */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(105deg, transparent 35%, rgba(255,240,215,.55) 48%, transparent 60%);
  background-size: 250% 100%; background-position: 130% 0;
}
.paw-next:not(:disabled)::after { animation: shine 2.6s ease-in-out infinite; }
@keyframes shine { 0%, 55% { background-position: 130% 0; } 100% { background-position: -40% 0; } }
.paw-badge {
  position: relative; flex: none; width: 54px; height: 54px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFFDF8, #F6E7D2 70%);
  box-shadow: 0 3px 0 #D8BFA0, inset 0 -2px 0 rgba(150,110,70,.18);
  display: grid; place-items: center;
}
.paw-badge .paw { width: 38px; height: 38px; }
.paw-next:not(:disabled) .paw-badge .paw { animation: wiggle 2.4s ease-in-out infinite; transform-origin: 50% 80%; }
.paw-next:not(:disabled) .paw-badge { animation: glow 2.4s ease-in-out infinite; }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0) translateX(0); } 68% { transform: rotate(-12deg) translateX(-1px); } 76% { transform: rotate(10deg) translateX(2px); } 84% { transform: rotate(-6deg); } 92% { transform: rotate(3deg) translateX(1px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 3px 0 #D8BFA0, 0 0 0 0 rgba(255,214,140,0); } 50% { box-shadow: 0 3px 0 #D8BFA0, 0 0 0 7px rgba(255,214,140,.45); } }
.spark { position: absolute; width: 12px; height: 12px; pointer-events: none; opacity: 0; }
.spark::before, .spark::after { content: ""; position: absolute; left: 50%; top: 50%; background: #FFE7A8; border-radius: 2px; transform: translate(-50%, -50%); }
.spark::before { width: 3px; height: 12px; }
.spark::after { width: 12px; height: 3px; }
.spark.s1 { top: -6px; right: 4px; }
.spark.s2 { bottom: -2px; right: -6px; width: 9px; height: 9px; }
.spark.s3 { top: 10px; left: -9px; width: 8px; height: 8px; }
.paw-next:not(:disabled) .spark { animation: twinkle 2.4s ease-in-out infinite; }
.paw-next:not(:disabled) .spark.s2 { animation-delay: .5s; }
.paw-next:not(:disabled) .spark.s3 { animation-delay: 1s; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 40% { opacity: 1; transform: scale(1) rotate(45deg); } 70% { opacity: 0; transform: scale(.5) rotate(90deg); } }

.paw-back {
  flex: none; min-height: 68px; border-radius: 999px; padding: 0 16px 0 7px;
  border: 2px solid var(--line); background: linear-gradient(180deg, #FFFDF8, #F6EEE2); color: var(--paw-dark);
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 6px 0 #D9C7AB, 0 10px 16px rgba(110,74,44,.14);
  font-size: 15px; font-weight: 600;
  transition: transform .07s, box-shadow .07s; touch-action: manipulation;
}
.paw-back:active, .paw-back.pressed { transform: translateY(5px); box-shadow: 0 1px 0 #D9C7AB, 0 3px 6px rgba(110,74,44,.12); }
.paw-back .paw-badge { width: 46px; height: 46px; background: radial-gradient(circle at 35% 30%, #fff, #F3E4CF 70%); }
.paw-back .paw { width: 32px; height: 32px; transform: scaleX(-1); }

/* ---------- 질문 ---------- */
.q-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--child); }
.adult .dots i.on { background: var(--adult); }
.story { margin: 0; font-size: 15px; color: var(--sub); }
.story b { font-family: var(--font-title); font-weight: 400; font-size: 23px; color: var(--ink); display: block; line-height: 1.35; margin-bottom: 2px; }
.question { font-size: 22px; line-height: 1.5; font-weight: 700; letter-spacing: -.01em; }
.adult-note { font-size: 14px; color: var(--adult); background: var(--adult-soft); border-radius: 12px; padding: 8px 12px; }

.scene { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: #efe3cf; aspect-ratio: 3 / 2; max-width: 100%; }
.scene > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.25,.7,.25,1); }
.scene .room-host { position: absolute; inset: 0; }
.scene .room-host.rs-ready + img, .scene .room-host.rs-ready ~ img { opacity: 0; }
.scene-cap { position: absolute; left: 10px; bottom: 10px; right: 10px; z-index: 3; pointer-events: none; display: flex; justify-content: flex-start; }
.scene-cap span { background: rgba(255,253,248,.92); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink); }
.pin { position: absolute; z-index: 4; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 4px solid #fff; background: var(--child); box-shadow: 0 2px 8px rgba(0,0,0,.3); pointer-events: none; }
.adult .pin { background: var(--adult); }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice {
  position: relative; border: 2px solid var(--line); background: var(--card); border-radius: 20px;
  padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 8px; text-align: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s, box-shadow .1s, border-color .15s;
}
.choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choice img { width: 100%; aspect-ratio: 5 / 3; object-fit: cover; border-radius: 14px; background: #f3e9d9; }
.choice strong { font-size: 16px; line-height: 1.4; font-weight: 500; min-height: 2.8em; display: grid; place-items: center; }
.choice[aria-pressed="true"] strong { font-weight: 700; }
.choice[aria-pressed="true"] { border-color: var(--child); box-shadow: 0 4px 0 var(--child); background: var(--child-soft); }
.adult .choice[aria-pressed="true"] { border-color: var(--adult); box-shadow: 0 4px 0 var(--adult); background: var(--adult-soft); }
.choice .stamp { position: absolute; top: -8px; right: -6px; width: 38px; height: 38px; border-radius: 50%; background: var(--child); color: #fff; display: none; place-items: center; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
.adult .choice .stamp { background: var(--adult); }
.choice[aria-pressed="true"] .stamp { display: grid; animation: pop .35s ease-out; }
.choice .stamp svg { width: 24px; height: 24px; }
.choice.speaking { border-color: #D9A33C; box-shadow: 0 0 0 4px rgba(217,163,60,.35), 0 4px 0 var(--line); }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.other-pick { font-size: 15px; color: var(--sub); text-align: center; }
.other-pick b { color: var(--ink); }

.cheer { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ok); }
.cheer img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: 30% 20%; border: 2px solid var(--line); }
.reason { display: flex; flex-direction: column; gap: 8px; }
.reason label { font-weight: 600; }
.reason .opt { font-weight: 500; color: var(--sub); font-size: 14px; }
.reason textarea { width: 100%; min-height: 76px; resize: vertical; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; padding: 12px; font-size: 17px; line-height: 1.5; }
.reason textarea:focus { border-color: var(--child); outline: none; }
.mic-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mic { display: inline-flex; align-items: center; gap: 8px; }
.mic svg { width: 20px; height: 20px; }
.mic[aria-pressed="true"] { background: #FCE7DF; border-color: #E9A08A; color: var(--warn); }
.mic-status { font-size: 14px; color: var(--sub); }
.listen { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.listen svg { width: 20px; height: 20px; }

/* ---------- 건네기 · 알 ---------- */
.center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 14px; }
.egg-wobble { width: 150px; height: auto; filter: drop-shadow(0 12px 14px rgba(110,74,44,.25)); animation: wobble 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
.egg-pair { display: flex; gap: 18px; align-items: flex-end; justify-content: center; }
.egg-pair figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.egg-pair img { width: 110px; }
.egg-pair figure:nth-child(2) img { animation-delay: .4s; }
@keyframes wobble { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-7deg); } 30% { transform: rotate(6deg); } 45% { transform: rotate(-3deg); } 60% { transform: rotate(0); } }
.handoff-art { width: 100%; max-width: 360px; aspect-ratio: 3 / 2; object-fit: cover; object-position: 10% 50%; border-radius: 24px; border: 1px solid var(--line); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
.steps li { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.steps .n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--child); }
.steps .n.adult { background: var(--adult); }
.steps .n.egg { background: #C9862F; }
.steps .n.done { background: var(--ok); }
.steps li p { margin: 0; font-size: 16px; line-height: 1.4; }
.steps li p span { display: block; font-size: 14px; font-weight: 400; color: var(--sub); }
.steps li p b { font-weight: 700; }

.egg-frame { width: 100%; height: min(560px, 62dvh); border: 0; border-radius: 22px; background: #efe6da; display: block; }
.egg-status { font-size: 14px; color: var(--sub); text-align: center; }
.friend-reveal img { width: min(240px, 64vw); filter: drop-shadow(0 14px 16px rgba(110,74,44,.25)); animation: rise .7s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes rise { from { transform: translateY(30px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

.meet { position: relative; height: 260px; width: 100%; max-width: 420px; }
.meet img { position: absolute; bottom: 10px; width: 46%; filter: drop-shadow(0 12px 12px rgba(110,74,44,.25)); }
.meet .l { left: 2%; animation: inL 1.4s cubic-bezier(.2,.8,.3,1) both; }
.meet .r { right: 2%; animation: inR 1.4s cubic-bezier(.2,.8,.3,1) both; }
.meet .heart { position: absolute; left: 50%; top: 22px; width: 54px; margin-left: -27px; color: #E07A6A; animation: beat 1.2s 1.3s ease-in-out infinite both; }
@keyframes inL { from { transform: translateX(-70%) rotate(-8deg); opacity: 0; } to { transform: translateX(14%); opacity: 1; } }
@keyframes inR { from { transform: translateX(70%) rotate(8deg); opacity: 0; } to { transform: translateX(-14%); opacity: 1; } }
@keyframes beat { 0% { transform: scale(0); opacity: 0; } 20% { transform: scale(1.15); opacity: 1; } 40%,100% { transform: scale(1); opacity: 1; } }

/* ---------- 결과지 ---------- */
.report { display: flex; flex-direction: column; gap: 18px; }
.report section { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.report .sec-label { font-size: 13px; font-weight: 700; color: var(--sub); letter-spacing: .04em; }
.friends { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.friend { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 12px 8px; border-radius: 18px; background: var(--bg); min-width: 0; }
.friend img { width: 100%; max-width: 150px; }
.friend strong { font: 400 21px/1.3 var(--font-title); }
.code { font: 700 15px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; color: var(--sub); }
.axis { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 0; border-top: 1px dashed var(--line); }
.axis:first-of-type { border-top: 0; padding-top: 4px; }
.axis .pair { font: 800 18px/1 ui-monospace, "SF Mono", Menlo, monospace; display: grid; place-items: center; height: 44px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.axis h3 { font-size: 16px; }
.axis ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.axis li { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 6px; row-gap: 4px; align-items: baseline; }
.axis li b { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 16px; }
.axis li .who { grid-column: 2; }
.who { display: inline-flex; gap: 4px; }
.who span { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.who .c { background: var(--child-soft); color: var(--child); }
.who .a { background: var(--adult-soft); color: var(--adult); }
.qa { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px dashed var(--line); }
.qa:first-of-type { border-top: 0; padding-top: 0; }
.qa h3 { font-size: 16px; }
.qa .same { font-size: 13px; font-weight: 700; color: var(--ok); }
.ans { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; font-size: 15px; }
.ans .r { font-weight: 700; }
.ans .r.c { color: var(--child); }
.ans .r.a { color: var(--adult); }
.ans q { display: block; color: var(--sub); quotes: "“" "”"; margin-top: 2px; }
.ans .none { display: block; color: #8A7D70; font-size: 14px; }
.profile h3 { font-size: 16px; margin-top: 4px; }
.profile p { margin: 0; font-size: 15px; }
details summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.photo-box { border: 2px dashed var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.photo-box img { width: 100%; border-radius: 14px; max-height: 60dvh; object-fit: contain; background: #f3e9d9; }
.photo-box input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.photo-label { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 16px; background: var(--adult-soft); color: var(--adult); font-weight: 800; }
.photo-label svg { width: 22px; height: 22px; }
.save-line { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.save-line.ok { color: var(--ok); }
.save-line.err { color: var(--warn); }
.test-badge { align-self: flex-start; font-size: 12px; font-weight: 800; color: #fff; background: #B25A3A; border-radius: 999px; padding: 3px 10px; }

/* ---------- 확인 시트 ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(42,38,34,.4); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
.sheet { width: 100%; max-width: 560px; background: var(--card); border-radius: 24px 24px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .25s ease-out both; }
.sheet h2 { font: 400 27px/1.3 var(--font-title); }
.sheet p { margin: 0; color: var(--sub); }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .page.turn-next, .page.turn-back { animation: fadeOnly .2s both !important; }
  @keyframes fadeOnly { from { opacity: 0; } }
  .page-curl { display: none; }
}
@media (min-width: 700px) {
  .choices { gap: 14px; }
  .question { font-size: 24px; }
}

/* ---------- 손그림 질감: 명도·채도를 낮추고 종이 결을 얹어요 ---------- */
.art { filter: saturate(.8) brightness(1.04) contrast(.93) sepia(.07); }
.artbox { position: relative; display: block; border-radius: 14px; overflow: hidden; }
.artbox::after, .scene::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; mix-blend-mode: multiply;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .48  0 0 0 0 .34  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 50% 45%, rgba(255,250,240,0) 55%, rgba(150,115,75,.16) 100%);
}
.choice .artbox img { display: block; }

/* ---------- 장마다 바뀌는 장면 ---------- */
.scene { box-shadow: 0 6px 0 var(--line); }
.scene .light { position: absolute; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: soft-light; transition: opacity .8s; }
.scene.l1 .light { background: radial-gradient(ellipse at 15% 10%, rgba(255,236,170,.75), transparent 60%); }
.scene.l2 .light { background: radial-gradient(ellipse at 35% 60%, rgba(255,225,190,.7), transparent 65%); }
.scene.l3 .light { background: linear-gradient(160deg, rgba(255,212,140,.65), transparent 70%); }
.scene.l4 .light { background: linear-gradient(200deg, rgba(255,190,170,.6), rgba(190,170,230,.3) 70%, transparent); }
.scene > img.enter { animation: kb 1.8s cubic-bezier(.25,.7,.25,1) both; }
@keyframes kb { from { transform: scale(var(--s0)) ; transform-origin: var(--o); } to { transform: scale(var(--s1)); transform-origin: var(--o); } }
.scene .peek { position: absolute; z-index: 3; right: -6px; bottom: -10px; width: 31%; max-width: 150px; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(90,60,30,.25)) saturate(.85) brightness(1.03); animation: peek .9s .35s cubic-bezier(.2,.9,.3,1.3) both; }
.scene .bubble { position: absolute; z-index: 3; right: 27%; bottom: 46%; max-width: 54%; background: rgba(255,253,248,.96); border-radius: 16px; padding: 8px 12px; font-size: 14px; font-weight: 600; line-height: 1.4; box-shadow: 0 4px 10px rgba(90,60,30,.15); animation: pop .4s .8s ease-out both; }
.scene .bubble::after { content: ""; position: absolute; right: -6px; bottom: 12px; width: 14px; height: 14px; background: inherit; transform: rotate(45deg); border-radius: 3px; }
@keyframes peek { from { transform: translateY(40%) rotate(8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.scene-cap { justify-content: flex-start; right: 34%; }

/* ---------- 학습지 칭찬 도장 ---------- */
.cheer { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 18px; background: color-mix(in srgb, var(--honey) 30%, var(--card)); border: 1px dashed #E2C99A; }
.cheer .mascot { width: 52px; height: auto; flex: none; filter: saturate(.85); animation: hop .6s ease-out; }
.cheer .says { flex: 1; font-size: 17px; font-weight: 700; color: var(--ink); }
.cheer .says small { display: block; font-size: 14px; font-weight: 500; color: var(--sub); }
.stamp-ink {
  flex: none; width: 70px; height: 70px; border-radius: 50%;
  border: 3px solid #C8553D; color: #C8553D;
  display: grid; place-items: center; text-align: center;
  font: 400 17px/1.05 var(--font-title);
  transform: rotate(-14deg);
  box-shadow: inset 0 0 0 3px #FFFDF8, inset 0 0 0 4.5px rgba(200,85,61,.55);
  background: rgba(255,253,248,.6);
  animation: stampIn .5s cubic-bezier(.3,1.6,.5,1) both;
}
.adult .stamp-ink { border-color: #7A4F2A; color: #7A4F2A; box-shadow: inset 0 0 0 3px #FFFDF8, inset 0 0 0 4.5px rgba(122,79,42,.5); }
@keyframes stampIn { 0% { transform: scale(2.2) rotate(-30deg); opacity: 0; } 60% { transform: scale(.92) rotate(-12deg); opacity: 1; } 100% { transform: scale(1) rotate(-14deg); } }
@keyframes hop { 0% { transform: translateY(8px) scale(.9); } 50% { transform: translateY(-6px); } 100% { transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .leaf, .turn-shade { display: none !important; }
  .scene > img.enter { animation: none !important; transform: scale(var(--s1)) !important; transform-origin: var(--o) !important; }
}
.scene > img.peek { inset: auto -4px -8px auto; width: 27%; max-width: 130px; height: auto; object-fit: contain; transform: none; transition: none; }
.ask-other { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: var(--card); border: 2px solid #E2C99A; box-shadow: 0 4px 0 var(--line); animation: pop .3s ease-out; }
.ask-other p { margin: 0; font-size: 17px; }
.ask-other .btn-soft { flex: 1; }
.handoff-art { aspect-ratio: 5 / 4; object-position: 0% 50%; }
.scene .ask-other { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; padding: 10px 12px; gap: 8px; box-shadow: 0 6px 16px rgba(60,40,20,.22); }
.scene .ask-other p { font-size: 16px; }
.scene .ask-other .btn-soft { min-height: 46px; font-size: 15px; padding: 6px 8px; }
/* 안내 토끼는 공통 그림 밖에: 조사 그림은 원본 그대로 */
.scene .peek, .scene .bubble { display: none; }
.scene-cap { right: 10px; }
.guide-line { display: flex; align-items: flex-end; gap: 8px; margin-bottom: -6px; }
.guide-line img { width: 54px; height: auto; flex: none; filter: saturate(.85) brightness(1.03); animation: hop .6s ease-out; }
.guide-line span { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 7px 13px; font-size: 15px; font-weight: 600; margin-bottom: 14px; box-shadow: 0 3px 0 var(--line); }
.guide-line span::before { content: ""; position: absolute; left: -7px; bottom: 10px; width: 12px; height: 12px; background: var(--card); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }

/* ---------- 선택 비교 그래프 ---------- */
.report section.graph { background: color-mix(in srgb, var(--child-soft) 45%, var(--card)); }
.chart-key { display: flex; gap: 16px; justify-content: center; font-size: 15px; font-weight: 700; }
.chart-key .child { color: var(--child); }
.chart-key .adult { color: var(--adult); }
.choice-picture { display: block; width: 100%; max-width: 380px; margin: 0 auto; overflow: visible; }
.chart-guide { fill: none; stroke: #CDBBA0; stroke-width: 1.1; }
.chart-guide line { stroke-dasharray: 3 3; }
.trace { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.trace.child { stroke: var(--child); }
.trace.adult { stroke: var(--adult); stroke-dasharray: 4 3; }
.marks.child { fill: var(--child); stroke: #FFFDF8; stroke-width: 1.3; }
.marks.adult { fill: #FFFDF8; stroke: var(--adult); stroke-width: 2.2; }
.chart-labels { fill: var(--ink); font-size: 11.5px; font-weight: 500; font-family: var(--font-body); }
.chart-labels .axis-code { font-size: 15px; font-weight: 700; fill: #3D6152; }
.chart-plot { animation: chartOpen .7s cubic-bezier(.2,.67,.28,1) both; transform-origin: 144px 116px; }
@keyframes chartOpen { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.chart-controls { display: flex; gap: 8px; justify-content: center; }
.chart-controls .btn-soft { flex: 1; min-height: 44px; padding: 6px 8px; font-size: 15px; }
.chart-controls .btn-soft[aria-pressed="true"] { background: var(--ink); color: #FFFDF8; border-color: var(--ink); box-shadow: 0 4px 0 #000; }
[data-chart-view="child"] .chart-key .adult, [data-chart-view="child"] :is(.trace, .marks).adult,
[data-chart-view="adult"] .chart-key .child, [data-chart-view="adult"] :is(.trace, .marks).child { opacity: .17; }

/* 만남 화면: 친구가 옆에서 들어올 때 화면 폭이 넓어지지 않게 */
.meet { overflow: hidden; }
.stage { overflow-x: clip; }

/* 아주 좁은 화면 (폴드 접은 화면 등) */
.paw-next .label { white-space: nowrap; }
@media (max-width: 340px) {
  .paw-back { padding: 0 7px; }
  .paw-back > span:last-child { display: none; }
  .paw-next { padding-left: 14px; font-size: 17px; }
  .paw-badge { width: 48px; height: 48px; }
  .cheer { gap: 8px; padding: 8px 10px; }
  .cheer .mascot { width: 40px; }
  .cheer .says { font-size: 15px; }
  .stamp-ink { width: 54px; height: 54px; font-size: 13px; }
  .choice strong { font-size: 15px; }
}
/* 가로 화면: 버튼 영역을 낮게 */

/* ---------- v1.2 · 글 줄인 질문 화면 ---------- */

/* ---------- 정리 친구 16종: 색·움직임으로 성격을 보여요 ---------- */
.pal { margin: 0; position: relative; display: grid; justify-items: center; align-items: end; }
.pal::before { content: ""; position: absolute; inset: 12% 8% 0; border-radius: 50%; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--pc) 30%, transparent), transparent 70%); z-index: 0; }
.pal img { position: relative; z-index: 1; width: 100%; max-width: 100%; filter: drop-shadow(0 10px 10px rgba(90,60,30,.22)); transform-origin: 50% 90%; }
.pal.big { width: min(230px, 62vw); }
.pal.mini { width: 84px; flex: none; }
.m-hop img    { animation: pHop 1.1s ease-in-out infinite; }
.m-sway img   { animation: pSway 3s ease-in-out infinite; }
.m-wag img    { animation: pWag .9s ease-in-out infinite; }
.m-waddle img { animation: pWaddle 1.2s ease-in-out infinite; }
.m-snap img   { animation: pSnap 2.2s steps(1) infinite; }
.m-puff img   { animation: pPuff 1.6s ease-in-out infinite; }
.m-float img  { animation: pFloat 3.4s ease-in-out infinite; }
.m-hug img    { animation: pHug 2s ease-in-out infinite; }
.m-twitch img { animation: pTwitch 2.4s ease-in-out infinite; }
.m-dash img   { animation: pDash 1.8s cubic-bezier(.5,0,.2,1) infinite; }
.m-swirl img  { animation: pSwirl 3.2s ease-in-out infinite; }
.m-bighop img { animation: pBigHop 1.4s cubic-bezier(.3,.7,.4,1) infinite; }
.m-curl img   { animation: pCurl 2.6s ease-in-out infinite; }
.m-roll img   { animation: pRoll 2.4s ease-in-out infinite; }
.m-bounce img { animation: pBounce 1.3s ease-in-out infinite; }
.m-flip img   { animation: pFlip 3s ease-in-out infinite; }
@keyframes pHop { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-9%); } 50% { transform: translateY(0) scaleY(.94); } 70% { transform: translateY(-5%); } }
@keyframes pSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-2%); } }
@keyframes pWag { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes pWaddle { 0%,100% { transform: rotate(-7deg) translateX(-3%); } 50% { transform: rotate(7deg) translateX(3%); } }
@keyframes pSnap { 0% { transform: rotate(0); } 40% { transform: rotate(-6deg); } 60% { transform: rotate(6deg); } 80% { transform: rotate(0) scale(1.04); } }
@keyframes pPuff { 0%,100% { transform: scale(1); } 45% { transform: scale(1.08, .95); } 60% { transform: scale(.97, 1.04); } }
@keyframes pFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
@keyframes pHug { 0%,100% { transform: scale(1); } 40% { transform: scale(1.06, .94); } 55% { transform: scale(.98, 1.03); } }
@keyframes pTwitch { 0%,70%,100% { transform: rotate(0); } 75% { transform: rotate(-8deg); } 82% { transform: rotate(8deg); } 90% { transform: rotate(-3deg); } }
@keyframes pDash { 0% { transform: translateX(0); } 20% { transform: translateX(-6%) skewX(6deg); } 40% { transform: translateX(10%) skewX(-10deg); } 60%,100% { transform: translateX(0); } }
@keyframes pSwirl { 0%,100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-6deg) translateY(-3%); } 75% { transform: rotate(6deg) translateY(-3%); } }
@keyframes pBigHop { 0%,100% { transform: translateY(0) scale(1); } 15% { transform: translateY(0) scale(1.06, .9); } 45% { transform: translateY(-16%) scale(.96, 1.06); } 75% { transform: translateY(0) scale(1.04, .94); } }
@keyframes pCurl { 0%,60%,100% { transform: rotate(0) scale(1); } 70% { transform: rotate(-15deg) scale(.92); } 85% { transform: rotate(10deg) scale(1.02); } }
@keyframes pRoll { 0%,100% { transform: rotate(0) translateX(0); } 30% { transform: rotate(-10deg) translateX(-4%); } 60% { transform: rotate(10deg) translateX(4%); } }
@keyframes pBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }
@keyframes pFlip { 0%,70%,100% { transform: rotateY(0); } 85% { transform: rotateY(180deg) translateY(-6%); } }

.friend-reveal { gap: 10px; }

/* 결과지: 친구 카드에 친구 색, 메시지 카드 */

/* 정리 시범 */

/* ---------- 손가락 안내 ---------- */
.tap-hand { position: fixed; left: 0; top: 0; z-index: 35; width: 64px; height: 64px; pointer-events: none; margin: -4px 0 0 -28px; transition: transform .45s cubic-bezier(.3,.8,.3,1); filter: drop-shadow(0 5px 6px rgba(70,45,20,.3)); }

@keyframes tapTap { 0%,100% { transform: translate(6px,10px) rotate(-8deg); } 45% { transform: translate(0,0) rotate(-8deg) scale(.94); } 60% { transform: translate(0,0) rotate(-8deg) scale(.94); } }
@keyframes ripple { 0%,40% { transform: scale(.3); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tap-hand { transition: none; } .tap-hand .ripple { display: none; } }
/* 1장 입체 방(원본 엔진이 그리는 캔버스)에도 같은 손그림 색감 */

/* ---------- 우리 집 사진 놀이 ---------- */
/* 결과지의 ‘우리 집 사진 놀이’: 저장 버튼(파란 버튼)과 다른 꿀색으로, 다음에 할 놀이라는 게 한눈에 보이게 */
.photo-cta { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 20px 18px 18px; border-radius: 24px;
  background: linear-gradient(160deg, #FFF1D3, #F8DDA8); border: 2px solid #E6BE76; box-shadow: 0 6px 0 #E0B66A; }

.photo-cta .cta-rabbit { position: absolute; right: 4px; top: 6px; width: 72px; transform: rotate(6deg); animation: hop 1.6s ease-in-out infinite; filter: saturate(.9); }
.cta-steps { list-style: none; margin: 2px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.cta-steps li { display: inline-flex; align-items: center; gap: 6px; background: #FFFDF8; border: 1.5px solid #E6BE76; border-radius: 999px; padding: 3px 11px 3px 4px; font-size: 14px; font-weight: 700; }
.cta-steps b { width: 22px; height: 22px; border-radius: 50%; background: var(--child); color: #fff; display: grid; place-items: center; font-size: 13px; }
.btn-photo { position: relative; margin-top: 6px; min-height: 64px; border: 0; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(180deg, #F2A25A, #DB7A2E); color: #fff; font-size: 19px; font-weight: 700;
  box-shadow: 0 7px 0 #A9541A, 0 14px 22px rgba(169,84,26,.28), inset 0 2px 0 rgba(255,255,255,.3); transition: transform .07s, box-shadow .07s; touch-action: manipulation; animation: glowBtn 2.4s ease-in-out infinite; }
.btn-photo svg { width: 26px; height: 26px; flex: none; }
.btn-photo:active, .btn-photo.pressed { transform: translateY(6px); box-shadow: 0 1px 0 #A9541A, inset 0 2px 4px rgba(0,0,0,.18); }
@keyframes glowBtn { 0%,100% { filter: none; } 50% { filter: brightness(1.06); } }
.save-box .btn-soft svg { width: 22px; height: 22px; vertical-align: -5px; margin-right: 4px; }
/* 1장에서 방 그림 속 장난감을 고르면 보이는 ‘고른 카드’ */
.choice.other-card { grid-column: 1 / -1; display: grid; grid-template-columns: 42% 1fr; align-items: center; gap: 12px; text-align: left; animation: pop .35s ease-out; }
.other-card .artbox { aspect-ratio: 5 / 3; background: #f3e9d9; }
.other-card .crop { position: absolute; inset: 0; background: url("assets/shared-room.webp") no-repeat; background-size: 360% auto; filter: saturate(.86) brightness(.97); }
.other-card .crop-pin { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--child); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 2; }
.adult .other-card .crop-pin { background: var(--adult); }
.other-card strong { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 0; font-size: 18px; }

/* 아이의 책 · 부모님의 책 표지 */
.book-start { gap: 18px; }
.book { position: relative; width: 100%; max-width: 420px; border-radius: 8px 22px 22px 8px; padding: 10px 10px 10px 22px; background: linear-gradient(90deg, #8E6440 0 14px, #B98A5E 14px 18px, #FFFDF8 18px);
  box-shadow: 0 8px 0 #D8C3A2, 0 18px 30px rgba(110,74,44,.22); border: 1.5px solid #CDB18A; animation: rise .6s ease-out; }
.book.adult { background: linear-gradient(90deg, #6E4A2C 0 14px, #9A6B43 14px 18px, #FFFDF8 18px); }
.book.child { background: linear-gradient(90deg, #2E5B92 0 14px, #5C86BA 14px 18px, #FFFDF8 18px); }
.book-art { border-radius: 4px 14px 14px 4px; overflow: hidden; line-height: 0; }
.book-art .art { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; background: #efe3cf; }
.book-plate { position: relative; margin: 12px auto 4px; width: fit-content; display: flex; flex-direction: column; align-items: center; background: #FFFDF8; border: 2px solid #E2C99A; border-radius: 16px; padding: 6px 20px 4px; box-shadow: 0 4px 0 #E2C99A; white-space: nowrap; }
.book-title { font: 400 27px/1.2 var(--font-title); }

.book { display: flex; flex-direction: column; }
/* 첫 톡 안내: 브라우저가 소리를 막았을 때만 보여요 */
.touch-chip { position: fixed; z-index: 34; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 62px); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 2px solid #E6BE76; background: #FFF4DC; color: var(--ink); font-weight: 700; font-size: 15px; box-shadow: 0 4px 0 #E6BE76, 0 8px 18px rgba(110,74,44,.2); white-space: nowrap; animation: chipBob 1.4s ease-in-out infinite; }

@keyframes chipBob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(3px); } }

.hp-photo { position: relative; align-self: center; width: fit-content; max-width: 100%; line-height: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 6px 0 var(--line); cursor: crosshair; touch-action: manipulation; }

.hp-pin.child { border-radius: 50%; background: var(--child); }

/* ---------- 책장 넘김 v3: 앞면은 지난 쪽, 뒷면은 종이 뒷장. 왼쪽 책등을 축으로 한 장이 넘어가요 ---------- */
.leaf { background: none; box-shadow: none; overflow: visible; transform-style: preserve-3d; }
.leaf-face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.leaf-face.front { background: var(--bg); }
.leaf-face.front::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(255,255,255,0) 40%, rgba(255,250,240,.5) 70%, rgba(110,80,45,.3) 100%); opacity: 0; animation: leafLight .9s ease-in forwards; }
.leaf-face.back { transform: rotateY(180deg); background: linear-gradient(270deg, #EFE3CF, #F8EEDD 35%, #FBF4E8 70%, #E9DAC1); }
.leaf-face.back::before { content: ""; position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .33  0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.leaf::after { display: none; }
.leaf.next { animation: pageTurn .9s cubic-bezier(.45,.05,.3,1) forwards; transform-origin: left center; }
.leaf.back { animation: pageTurnBack .9s cubic-bezier(.45,.05,.3,1) forwards; transform-origin: right center; }
.leaf.back .leaf-face.front::after { background: linear-gradient(270deg, rgba(255,255,255,0) 40%, rgba(255,250,240,.5) 70%, rgba(110,80,45,.3) 100%); }
@keyframes pageTurn {
  0%   { transform: perspective(1400px) rotateY(0) translateZ(0) skewY(0); }
  18%  { transform: perspective(1400px) rotateY(-14deg) translateZ(20px) skewY(-2deg); }
  55%  { transform: perspective(1400px) rotateY(-95deg) translateZ(30px) skewY(-3deg); }
  100% { transform: perspective(1400px) rotateY(-178deg) translateZ(0) skewY(0); }
}
@keyframes pageTurnBack {
  0%   { transform: perspective(1400px) rotateY(0) translateZ(0) skewY(0); }
  18%  { transform: perspective(1400px) rotateY(14deg) translateZ(20px) skewY(2deg); }
  55%  { transform: perspective(1400px) rotateY(95deg) translateZ(30px) skewY(3deg); }
  100% { transform: perspective(1400px) rotateY(178deg) translateZ(0) skewY(0); }
}
.turn-shade { animation: shade .9s ease-out forwards; }

/* 2~5장: 누른 장난감 이름이 작게 톡 */
.toy-pop { position: absolute; z-index: 4; pointer-events: none; display: flex; align-items: center; gap: 6px; transform: translate(-14px, -50%); animation: pop .3s ease-out; }
.toy-pop i { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 3px rgba(255,214,140,.9), 0 3px 8px rgba(0,0,0,.25); animation: ring 1.2s ease-out infinite; }
.toy-pop b { background: rgba(255,253,248,.96); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 3px 8px rgba(60,40,20,.2); }
.toy-pop.flip { flex-direction: row-reverse; transform: translate(calc(-100% + 14px), -50%); }
@keyframes ring { 0% { box-shadow: 0 0 0 2px rgba(255,214,140,.9), 0 3px 8px rgba(0,0,0,.25); } 100% { box-shadow: 0 0 0 12px rgba(255,214,140,0), 0 3px 8px rgba(0,0,0,.25); } }
.scene[data-act="scene-tap"] { cursor: pointer; }

/* 1장 확인: 그림 아래에 작게 (그림을 가리지 않게) */
.ask-other { position: static; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px; }

/* 첫 화면 토끼 · 이 놀이는요 */
.intro-rabbit { display: flex; align-items: flex-end; gap: 10px; }

/* ---------- 책장 넘김 v4 (폰용): 오른쪽 모서리부터 접히며 왼쪽으로 쓸려 넘어가요 ----------
   지난 쪽(앞면)은 오른쪽부터 잘려 나가고, 접힌 종이 뒷면(.leaf-fold)이 그 경계를 따라 움직여요 */
.leaf, .leaf.next, .leaf.back { animation: none; transform: none; backface-visibility: visible; transform-style: flat; overflow: hidden; }
.leaf .leaf-face.front { inset: 0; animation: peelNext .85s cubic-bezier(.5,.1,.35,1) forwards; }
.leaf .leaf-face.front::after { animation: none; opacity: 1; background: linear-gradient(90deg, rgba(0,0,0,0) 70%, rgba(90,62,32,.18)); }
.leaf-fold {
  position: absolute; top: -4%; bottom: -4%; right: 0; width: 22%; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, #E6D6BC 0%, #F6ECDC 45%, #FFFBF3 80%, #EFE2CC 100%);
  box-shadow: -14px 0 22px rgba(80,55,28,.22), 10px 0 18px rgba(80,55,28,.28);
  border-radius: 0 40% 40% 0 / 0 8% 8% 0;
  transform-origin: right center;
  animation: foldNext .85s cubic-bezier(.5,.1,.35,1) forwards;
}
.leaf-fold::before { content: ""; position: absolute; inset: 0; opacity: .45; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .33  0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); border-radius: inherit; }
@keyframes peelNext { 0% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes foldNext {
  0%   { right: 0;    width: 0;   transform: skewY(0); }
  25%  { right: 18%;  width: 20%; transform: skewY(-2.5deg); }
  70%  { right: 64%;  width: 16%; transform: skewY(-1.5deg); }
  100% { right: 100%; width: 2%;  transform: skewY(0); opacity: .6; }
}
/* 뒤로 넘길 때는 반대로: 왼쪽부터 접혀 오른쪽으로 */
.leaf.back .leaf-face.front { animation-name: peelBack; }
.leaf.back .leaf-face.front::after { background: linear-gradient(270deg, rgba(0,0,0,0) 70%, rgba(90,62,32,.18)); }
.leaf.back .leaf-fold { right: auto; left: 0; border-radius: 40% 0 0 40% / 8% 0 0 8%; background: linear-gradient(270deg, #E6D6BC 0%, #F6ECDC 45%, #FFFBF3 80%, #EFE2CC 100%); animation-name: foldBack; }
@keyframes peelBack { 0% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 0 0 100%); } }
@keyframes foldBack {
  0%   { left: 0;    width: 0;   transform: skewY(0); }
  25%  { left: 18%;  width: 20%; transform: skewY(2.5deg); }
  70%  { left: 64%;  width: 16%; transform: skewY(1.5deg); }
  100% { left: 100%; width: 2%;  transform: skewY(0); opacity: .6; }
}
.turn-shade { background: linear-gradient(90deg, rgba(90,64,36,0), rgba(90,64,36,.16)); animation: shade .85s ease-in forwards; }
.leaf-fold { border-left: 2px solid rgba(120,88,52,.35); box-shadow: -16px 0 24px rgba(80,55,28,.26), 12px 0 20px rgba(80,55,28,.32), inset 6px 0 10px rgba(120,88,52,.18); }
.leaf.back .leaf-fold { border-left: 0; border-right: 2px solid rgba(120,88,52,.35); }

/* ---------- 책장 넘김 v5: 종이가 돌돌 말리며 넘어가요 ----------
   --p(0→1)가 넘김 정도. 앞면은 비스듬한 접힘선 왼쪽만 남고, 그 선에 말린 종이 두루마리가 붙어 다니며 점점 두꺼워져요 */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
.leaf.roll { animation: rollP .95s cubic-bezier(.42,.05,.32,1) forwards; }
@keyframes rollP { from { --p: 0; } to { --p: 1; } }
.leaf.roll .leaf-face.front { animation: none; clip-path: polygon(0 0, calc((1 - var(--p)) * 118%) 0, calc((1 - var(--p)) * 118% - 18%) 100%, 0 100%); }
.leaf.roll .leaf-face.front::after { background: linear-gradient(90deg, rgba(0,0,0,0) 55%, rgba(90,62,32,.14)); }
.leaf.roll .leaf-fold {
  animation: none; right: auto; top: -30%; bottom: -30%; border: 0;
  left: calc((1 - var(--p)) * 118% - 9%);
  width: calc(14px + 44px * var(--p));
  transform: translateX(-35%) rotate(var(--ang, 8deg));
  border-radius: 999px;
  background:
    repeating-linear-gradient(90deg, rgba(120,90,55,0) 0 7px, rgba(120,90,55,.10) 7px 8px),
    linear-gradient(90deg, #B99F77 0%, #E9DBC3 18%, #FFFCF5 42%, #F3E7D3 62%, #CDB794 85%, #A88C63 100%);
  box-shadow: 14px 0 22px rgba(70,46,22,.32), -6px 0 12px rgba(70,46,22,.18);
  opacity: 1;
}
.leaf.roll.back .leaf-face.front { clip-path: polygon(calc(var(--p) * 118% - 18%) 0, 100% 0, 100% 100%, calc(var(--p) * 118%) 100%); }
.leaf.roll.back .leaf-face.front::after { background: linear-gradient(270deg, rgba(0,0,0,0) 55%, rgba(90,62,32,.14)); }
.leaf.roll.back .leaf-fold { left: calc(var(--p) * 118% - 9%); transform: translateX(-65%) rotate(var(--ang, -8deg)); box-shadow: -14px 0 22px rgba(70,46,22,.32), 6px 0 12px rgba(70,46,22,.18); }
.leaf.roll + .turn-shade, .turn-shade { animation-duration: .95s; }
.save-box { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- v1.5 다듬기 ---------- */
/* 말풍선 앞 토끼: 가만히 있을 때는 숨 쉬듯 흔들, 토끼가 말할 때는 통통 들썩 */

body.voice-on .intro-rabbit img, body.voice-on .guide-line img { animation: rabbitTalk .62s ease-in-out infinite; }
@keyframes rabbitIdle { 0%, 100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-4deg) translateY(-2px); } 50% { transform: rotate(0) translateY(0) scale(1.02, .98); } 75% { transform: rotate(4deg) translateY(-2px); } }
@keyframes rabbitTalk { 0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); } 35% { transform: translateY(-6px) rotate(3deg) scale(.97, 1.04); } 65% { transform: translateY(0) rotate(-1deg) scale(1.04, .96); } }

/* 부모님 안내: 네 단계를 한 묶음 카드로, 번호를 선으로 이어요 */

let audioUnlocked = false, needTouch = false;
function markUnlocked() { if (audioUnlocked) return; audioUnlocked = true; needTouch = false; document.body.classList.remove('need-touch'); }
voice.addEventListener('playing', markUnlocked);
/* 토끼가 말하는 동안 말풍선 앞 토끼가 함께 들썩여요 */
voice.addEventListener('playing', () => document.body.classList.add('voice-on'));
['pause', 'ended', 'error', 'emptied'].forEach((n) => voice.addEventListener(n, () => document.body.classList.remove('voice-on')));

let eggLoadingOn = false;
function play(list, onDone) {
  stopVoice();
  list = list.filter((it) => hasVoice(it.f));
  if (!soundOn || !list.length) { onDone?.(); return; }
  queue = list.slice();
  const token = ++playToken;
  const next = () => {
    if (token !== playToken) return;
    const item = queue.shift();
    document.querySelectorAll('.choice.speaking').forEach((b) => b.classList.remove('speaking'));
    if (!item) { onDone?.(); return; }
    if (item.mark) { const ch = document.querySelector(`.choice[data-v="${item.mark}"]`); ch?.classList.add('speaking'); if (S.role === 'child') { revealAboveBar(stage.querySelector('.choices')); pointAt(ch); } }
    voice.src = clipSrc(item.f);
    voice.onended = next;
    voice.onerror = next;
    voice.play().catch((err) => { if (token !== playToken) return; queue = []; if (err?.name === 'NotAllowedError') { blocked(); pending = { list, onDone }; } onDone?.(); });
  };
  next();
}
function stopVoice() {
  playToken++; queue = [];

  document.querySelectorAll('.choice.speaking').forEach((b) => b.classList.remove('speaking'));
}
function questionVoice(i) {

let pointTarget = null, pointRaf = 0, laterTimer = 0, idleTimer = 0;

/* 아직 안 골랐으면 두 보기를 번갈아, 골랐으면 다음 장 버튼을 가리켜요 */

/* 음성을 폰에 미리 받아 두고(작은 파일 묶음), 장이 바뀌면 받아 둔 것에서 바로 틀어요 */
const clipCache = new Map();
function clipSrc(f) { return clipCache.get(f) || 'assets/voice/' + f + '.mp3'; }
/* 받는 중인 파일은 같은 약속을 돌려줘서, 기다리는 쪽이 끝까지 받을 때까지 기다릴 수 있어요 */
function cacheClip(f) {
  if (clipCache.has(f) || !hasVoice(f)) return Promise.resolve();
  if (cacheClip.busy.has(f)) return cacheClip.busy.get(f);
  const p = fetch('assets/voice/' + f + '.mp3').then((r) => r.ok ? r.blob() : null).then((b) => { if (b && b.size) clipCache.set(f, URL.createObjectURL(b)); }).catch(() => {}).finally(() => cacheClip.busy.delete(f));
  cacheClip.busy.set(f, p);
  return p;
}
cacheClip.busy = new Map();
function warmVoice(i) { if (i < 0 || i >= Q.length) return; questionVoice(i).forEach(({ f }) => cacheClip(f)); }
/* 앞 장부터 차례로 받아요: 1장 → 2장 … 그다음 알·친구 안내 */
async function warmAll() {
  for (let i = 0; i < Q.length; i++) await Promise.all(questionVoice(i).map(({ f }) => cacheClip(f)));
  for (const f of ['handoff-child', 'egg-loading', 'egg-ready', 'egg-more', 'egg-error']) await cacheClip(f);
  /* 그다음 친구·시범·결과지·사진 놀이 음성도 미리 받아 둬요 (처음 재생 때 늦게 시작해 잘리지 않도록) */
  const rest = [...VOICES].filter((f) => !clipCache.has(f)).sort((a, b) => rank(a) - rank(b));
  for (const f of rest) await cacheClip(f);
  function rank(f) { return /^friend-/.test(f) ? 0 : f === 'meet' ? 1 : /^motion-|^mission-done-mobile$/.test(f) ? 2 : f === 'result-child' ? 3 : /^hp-/.test(f) ? 4 : 5; }
}

/* ---------- 저장소 (Claude 검토 저장소, 기존 태블릿 서버와 분리) ---------- */

let saveState = 'idle';
/* 운영 사이트(/mobile/)에서 열렸을 때는 같은 사이트의 설문 서버로 답을 보내요. Claude 검토 링크에서는 지금처럼 Claude 저장소를 써요 */
const ONLINE = /^\/mobile(\/|$)/.test(location.pathname) && !window.claude?.use;
async function saveRecord() {
  if (S.savedId) { saveState = 'ok'; paintSave(); return; }
  saveState = 'saving'; paintSave();
  /* 같은 가족 기록은 한 번만 저장되도록 번호를 한 번만 만들고 다시 보낼 때도 같은 번호를 써요 */
  if (!S.recordId) { S.recordId = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); persist(); }
  const id = S.recordId;
  const pack = (role) => ({ code: code(role), name: characters[code(role)] || '', answers: S.answers[role].map((a, i) => ({ q: i + 1, title: Q[i].title, choice: a.choice, label: optionLabel(role, i, a.choice), reason: a.reason.trim(), point: a.point, toy: a.toy || '' })) });
  const record = { surveyVersion: SURVEY_VERSION, sourceRelease: SOURCE_RELEASE, stimulus: STIMULUS, mode: 'one-phone', test: !!S.test, startedAt: S.startedAt, finishedAt: S.finishedAt || new Date().toISOString(), child: pack('child'), adult: pack('adult') };
  if (ONLINE) {
    try {
      const r = await fetch('/api/mobile-records', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, ...record }), cache: 'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      S.savedId = id; persist(); saveState = 'ok';
    } catch { saveState = 'err'; }
    paintSave(); return;
  }
  const store = await db();
  if (!store) { saveState = 'local'; paintSave(); return; }
  try {
    await store.collection('mobileRecords').doc(id).set(record);
    S.savedId = id; persist(); saveState = 'ok';

}

/* ---------- 선택 비교 그래프 (원본 choicePicture와 같은 축·같은 안쪽/바깥쪽) ----------
   위: 장난감 생각(P 안쪽 / F 바깥쪽) · 오른쪽: 놀고 싶은 곳(V / H) · 아래: 바꾸고 싶은 것(S / M) · 왼쪽: 만들던 놀이(D / B) */
const graphAxes = [
  { slot: 0, q: 1, inner: 'P', outer: 'F' },
  { slot: 1, q: 3, inner: 'V', outer: 'H' },
  { slot: 2, q: 4, inner: 'S', outer: 'M' },
  { slot: 3, q: 2, inner: 'D', outer: 'B' },

function choicePicture() {
  const center = [144, 116], dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const pos = (i, r) => dirs[i].map((d, j) => center[j] + d * r);

  const pts = {};
  ['adult', 'child'].forEach((role) => { const c = code(role) || ''; pts[role] = graphAxes.map((ax, i) => c[ax.slot] ? pos(i, c[ax.slot] === ax.inner ? 36 : 66) : null); });
  const spokes = dirs.map((_, i) => { const [x, y] = pos(i, 66); return `<line x1="${center[0]}" y1="${center[1]}" x2="${x}" y2="${y}"/>`; }).join('');
  const lines = Object.entries(pts).map(([role, a]) => `<g class="trace ${role}">${a.map((p, i) => { const n = a[(i + 1) % a.length]; return p && n ? `<line x1="${p[0]}" y1="${p[1]}" x2="${n[0]}" y2="${n[1]}"/>` : ''; }).join('')}</g>`).join('');
  const marks = Object.entries(pts).map(([role, a]) => `<g class="marks ${role}">${a.map((p) => !p ? '' : role === 'adult' ? `<rect x="${p[0] - 6}" y="${p[1] - 6}" width="12" height="12" rx="2"/>` : `<circle cx="${p[0]}" cy="${p[1]}" r="4.5"/>`).join('')}</g>`).join('');
  const labels = [[144, 17], [249, 111], [144, 205], [39, 111]];
  const desc = graphAxes.map((ax) => `${Q[ax.q].title}, 아이 ${optionLabel('child', ax.q, S.answers.child[ax.q].choice)}, 부모님 ${optionLabel('adult', ax.q, S.answers.adult[ax.q].choice)}`).join('. ');
  return `<svg class="choice-picture" viewBox="0 0 288 228" role="img" aria-labelledby="cp-t cp-d"><title id="cp-t">아이와 부모님이 고른 네 가지</title><desc id="cp-d">${esc(desc)}</desc>
    <g class="chart-guide"><polygon points="${ring(36)}"/><polygon points="${ring(66)}"/>${spokes}</g>
    <g class="chart-plot">${lines}${marks}</g>
    <g class="chart-labels">${labels.map(([x, y], i) => `<text x="${x}" y="${y}" text-anchor="middle" class="axis-code">${graphAxes[i].inner} / ${graphAxes[i].outer}</text><text x="${x}" y="${y + 15}" text-anchor="middle">${Q[graphAxes[i].q].title}</text>`).join('')}</g>
  </svg>`;
}
function graphSection(label) {

async function sheetPdf(jpeg, width, height) {
  // 원본 printPdf와 같은 방식: A4 한 장 가운데에 실제 크기(폭 190mm)로 넣어요

  const place = `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${((pw - w) / 2).toFixed(2)} ${((ph - h) / 2).toFixed(2)} cm /J Do Q\n`;
  add('%PDF-1.6\n'); add(new Uint8Array([37, 226, 227, 207, 211, 10]));
  object('<< /Type /Catalog /Pages 2 0 R /ViewerPreferences << /PrintScaling /None >> >>');
  object('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  object(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Resources << /XObject << /J 4 0 R >> >> /Contents 5 0 R >>`);
  object(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.length} >>\nstream\n`, image, '\nendstream');
  object(`<< /Length ${place.length} >>\nstream\n`, place, 'endstream');
  const xref = length; add(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`); offsets.slice(1).forEach((o) => add(`${String(o).padStart(10, '0')} 00000 n \n`));

  return new Blob(chunks, { type: 'application/pdf' });
}

    case 'mission-replay': stopVoice(); destroyMission(); mountMission(); break;
    case 'reason-open': {
      S.reasonOpen = S.role + S.index;
      const box = stage.querySelector('[data-reason]'); if (box) box.hidden = false; t.hidden = true;
      const ta = stage.querySelector('#reason'); if (ta) { ta.focus(); }
      break;
    }
    case 'chart-view': { const g = t.closest('.graph'); g.dataset.chartView = t.dataset.v; g.querySelectorAll('[data-act="chart-view"]').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); break; }
    case 'open-photo': S.hp = hpFresh(); if (photoUrl) S.hp.step = 1; go('photo'); break;
    case 'photo-again': if (photoUrl) URL.revokeObjectURL(photoUrl); photoUrl = null; S.hp = hpFresh(); go('photo', 'back'); break;
    case 'photo-tap': {
      const img = t.querySelector('img'); if (!img) break;
      const r = img.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
      if (x < 0 || x > 100 || y < 0 || y > 100) break;
      const h = hp(), s = hpSteps[h.step - 1];
      h.pins[s.key][h.turn] = { x: +x.toFixed(1), y: +y.toFixed(1) }; persist();
      render(null, { still: true, keepScroll: true });
      later(() => pointAt(barEl.querySelector('[data-act="photo-next"]')), 900);
      break;
    }
    case 'photo-next': {
      const h = hp();
      if (h.turn === 'child') h.turn = 'adult'; else { h.turn = 'child'; h.step++; }
      render('next'); break;
    }
    case 'photo-back': {
      const h = hp();
      if (h.turn === 'adult') h.turn = 'child'; else if (h.step > 1) { h.step--; h.turn = 'adult'; } else { go('result', 'back'); break; }
      render('back'); break;
    }
    case 'sound':
      soundOn = !soundOn; try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch {}
      if (!soundOn) stopVoice();
      try { roomInst?.setSound?.(soundOn, false); } catch {}
      headEl.innerHTML = headHtml();
      document.getElementById('egg-frame')?.contentWindow?.postMessage({ type: 'siseon-egg-controls', sound: soundOn, paused: false, narrating: false }, location.origin);
      break;
    case 'logo':
      if (S.screen === 'result' || !S.startedAt) { go('home', 'back'); break; }
      sheet({ title: '첫 화면으로 갈까요?', body: '지금까지 고른 답은 이 휴대폰에 그대로 남아 있어요. 첫 화면에서 ‘이어서 하기’를 누르면 같은 곳부터 다시 열려요.', yes: '첫 화면으로 가기', no: '계속하기', onYes: async () => { await micSettle(); const ta = stage.querySelector('#reason'); if (ta && S.screen === 'q') S.answers[S.role][S.index].reason = ta.value; persist(); S.resumeScreen = S.screen; S.screen = 'home'; render('back'); } });
      break;
    case 'ask-new':
      sheet({ title: '새 가족으로 시작할까요?', body: S.savedId ? (ONLINE ? '우리 가족 답은 이미 잘 보냈어요. 이 휴대폰의 답만 비우고 처음 화면으로 가요.' : '지금 결과는 모바일 검토 기록에 저장되어 있어요. 이 휴대폰의 답만 비우고 처음 화면으로 가요.') : '아직 보내지 않은 답이 이 휴대폰에서 지워져요. 지우고 새로 시작할까요?', yes: '새 가족 시작', no: '그대로 두기', onYes: () => { if (photoUrl) URL.revokeObjectURL(photoUrl); photoUrl = null; S = fresh(); persist(); render('back'); } });
      break;
    case 'mic': {
      if (!rec) return;
      if (rec.active) { rec.stop(); return; }
      stopVoice();
      const ta = stage.querySelector('#reason');
      if (rec.start(ta?.value || '')) { t.setAttribute('aria-pressed', 'true'); t.querySelector('span').textContent = '마치기'; }
      break;
    }
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'reason' && S.screen === 'q') {
    if (e.isTrusted && rec?.active) rec.cancel();
    S.answers[S.role][S.index].reason = e.target.value; persist();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'home-photo') {
    const f = e.target.files?.[0];
    if (!f || !f.type.startsWith('image/')) return;
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(f);
    S.hp = hpFresh(); S.hp.step = 1; persist();
    render('next');
  }
});
document.addEventListener('focusin', (e) => {
  if (e.target.matches?.('textarea, input[type=text]')) {
    document.body.classList.add('typing');
    setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }), 250);
  }
});
document.addEventListener('focusout', (e) => {
  if (e.target.matches?.('textarea, input[type=text]')) setTimeout(() => { if (!document.activeElement?.matches?.('textarea, input[type=text]')) document.body.classList.remove('typing'); }, 150);
});
document.addEventListener('pointerdown', (e) => { const b = e.target.closest('.btn-main, .btn-soft, .btn-photo, .paw-next, .paw-back'); if (b && !b.disabled) b.classList.add('pressed'); }, { passive: true });
['pointerup', 'pointercancel', 'pointerleave'].forEach((n) => document.addEventListener(n, () => document.querySelectorAll('.pressed').forEach((b) => b.classList.remove('pressed')), { passive: true }));
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopVoice(); missionInst?.pause(); persist(); } else if (S.screen === 'mission') missionInst?.play(); });
addEventListener('pagehide', () => { persist(); destroyRoom(); destroyMission(); });

/* ---------- 글꼴: 제목 히피체 (SIL OFL 1.1, © AI올컷). 본문은 Noto Sans KR ---------- */
(async () => {
  try {
    const buf = await (await fetch('assets/fonts/hippie.woff2')).arrayBuffer();
    const face = new FontFace('Hippie', buf);
    await face.load(); document.fonts.add(face);
  } catch {}
})();

/* ---------- 시작: 새로고침하면 멈춘 곳에서 이어요 ---------- */
render(null, { still: true });
setTimeout(() => { warmAll(); }, 700);
})();

</script>
