<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>고양이 알 속 친구 만나기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@800;900&display=swap">
<style>
/* Layout: one phone-shaped stage, the scene fills it; a power meter and the big hammer button float over the table.
   Single warm look on purpose (it matches the watercolor cards), so no dark variant. */
:root {
  color-scheme: light;
  --paper: #efe6da;
  --ink: #5b3a24;
  --wood: #c98c52;
  --wood-dark: #8a5631;
  --peach: #ff8c5a;
  --gold: #ffc23c;
  --cream: #fffaf2;
  --track: #e6d6c4;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.stage {
  position: relative;
  height: 100%;
  aspect-ratio: 9 / 16;
  max-width: 100%;
  container-type: size;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgb(91 58 36 / 0.18);
  background: var(--paper);
  user-select: none; -webkit-user-select: none;
}
canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
.hud {
  position: absolute; left: 0; right: 0; bottom: 3.2cqh;
  display: flex; flex-direction: column; align-items: center; gap: 1.4cqh;
  pointer-events: none;
}
.hint {
  font-family: var(--display);
  font-size: 5.4cqw;
  color: var(--ink);
  background: rgb(255 250 242 / 0.88);
  padding: 0.6cqh 4.5cqw;
  border-radius: 999px;
  text-align: center;
}
.meter-row { display: flex; align-items: center; gap: 2.4cqw; }
.meter {
  width: 58cqw; height: 4.4cqw; border-radius: 999px;
  background: var(--track); box-shadow: inset 0 0.5cqw 0 rgb(91 58 36 / 0.12);
  overflow: hidden;
}
.fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ffb37a, var(--peach) 55%, var(--gold));
  border-radius: 999px;
  transition: width .12s ease-out;
}
.meter.hot .fill { background: linear-gradient(90deg, var(--peach), var(--gold), #fff3b8); animation: pulse .35s infinite alternate; }
@keyframes pulse { to { filter: brightness(1.25); } }
.count {
  font-family: var(--display); font-size: 5cqw; color: var(--ink);
  font-variant-numeric: tabular-nums; min-width: 15cqw; text-align: left;
}
.hit {
  pointer-events: auto;
  font-family: var(--display);
  font-size: 8.8cqw;
  color: var(--cream);
  background: linear-gradient(180deg, #e2a565, var(--wood) 55%, #b57640);
  border: 0.6cqw solid var(--wood-dark);
  border-radius: 999px;
  padding: 1.5cqh 12cqw 1.8cqh;
  box-shadow: 0 1.2cqw 0 var(--wood-dark), 0 2.4cqw 3cqw rgb(91 58 36 / 0.3);
  text-shadow: 0 0.4cqw 0 var(--wood-dark);
  cursor: pointer;
  transition: transform .05s, box-shadow .05s;
  touch-action: manipulation;
}
.hit.pressed { transform: translateY(1cqw) scale(0.97); box-shadow: 0 0.2cqw 0 var(--wood-dark), 0 1cqw 2cqw rgb(91 58 36 / 0.3); }
.hit:focus-visible { outline: 1cqw solid var(--peach); outline-offset: 1cqw; }
.hit.again { background: linear-gradient(180deg, #ffad86, var(--peach) 60%, #e86f3e); border-color: #b9532a; box-shadow: 0 1.2cqw 0 #b9532a, 0 2.4cqw 3cqw rgb(91 58 36 / 0.3); text-shadow: 0 0.4cqw 0 #b9532a; }
.top { position: absolute; top: 2.2cqh; left: 3.5cqw; right: 3.5cqw; display: flex; justify-content: space-between; gap: 2cqw; }
.chip {
  font-family: var(--display); font-size: 3.9cqw;
  color: var(--ink); background: rgb(255 250 242 / 0.88);
  border: 0.4cqw solid rgb(91 58 36 / 0.25); border-radius: 999px;
  padding: 0.5cqh 3.2cqw; cursor: pointer;
}
.chip.on { border-color: var(--peach); color: #b9532a; }
.chip:focus-visible { outline: 0.8cqw solid var(--peach); }
/* clean screen: the scene itself is the button */
.top, .meter-row, .hit { display: none; }
.hud { bottom: 6cqh; }
.hud.up { bottom: auto; top: 2.5cqh; }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-size: 6cqw; color: var(--ink); background: var(--paper);
}
</style>

<div class="stage" id="stage">
  <canvas id="cv" width="1080" height="1920" role="button" tabindex="0" aria-label="알을 눌러 정리 친구 만나기"></canvas>
  <div class="top">
    <button class="chip" id="voiceBtn" type="button">아이 목소리 넣기</button>
    <button class="chip" id="sound" type="button" aria-pressed="true">소리 켜짐</button>
  </div>
  <input type="file" id="voiceFile" accept="audio/*" hidden>
  <div class="hud">
    <div class="hint" id="hint">알 속에서 누가 불러요! 알을 눌러 보세요</div>
    <div class="meter-row">
      <div class="meter" id="meter"><div class="fill" id="fill"></div></div>
      <div class="count" id="count">0/30</div>
    </div>
    <button class="hit" id="hit" type="button">콩! 두드리기</button>
  </div>
  <div class="loading" id="loading">친구를 만나러 가요…</div>
</div>

<script>
(() => {
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const hitBtn = document.getElementById('hit'), hintEl = document.getElementById('hint');
const fillEl = document.getElementById('fill'), meterEl = document.getElementById('meter'), countEl = document.getElementById('count');
const soundBtn = document.getElementById('sound'), voiceBtn = document.getElementById('voiceBtn'), voiceFile = document.getElementById('voiceFile');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const NEED = 70, GLOW_AT = 0.8;   // each hit adds (2 + 2*strength)/NEED; cracks up to 80%, then light, 100% bursts (about 20 s of tapping)
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - clamp(t)) ** 3;
const easeIn = t => clamp(t) ** 2.4;
const backOut = (t, s = 1.9) => { t = clamp(t) - 1; return t * t * ((s + 1) * t + s) + 1; };
const rad = d => d * Math.PI / 180;
const rot = (x, y, a) => { const c = Math.cos(rad(a)), s = Math.sin(rad(a)); return [x * c - y * s, x * s + y * c]; };
let seed = 7; const rnd = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (b - a) * (seed / 2147483647); };
const nowS = () => performance.now() / 1000;

let G, IMG = {};
const imgNames = ['bg', 'egg', 'edge_dark', 'edge_glow', 'edge_core', 'hammer', 'arm', 'hog', 'text'];
const imageOnce = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(src)); i.src = src; });
async function loadImg(src) { for(let attempt=0;attempt<3;attempt++){try{return await imageOnce(src);}catch(e){if(attempt===2)throw e;await new Promise(r=>setTimeout(r,250*(attempt+1)));}} }
async function loadImages(names) {
  const imgs = new Array(names.length);let cursor=0;
  await Promise.all(Array.from({length:4},async()=>{while(cursor<names.length){const i=cursor++,n=names[i];imgs[i]=await loadImg(n==='hog'?`a/hog_${TYPE_CODE}.png`:`a/${n}.${n==='bg'?'jpg':'png'}`);}}));
  return imgs;
}

// ---------- sound ----------
const EMBEDDED = new URLSearchParams(location.search).get('embedded')==='1';
let hostNarrating=false;
const sendGuide=stage=>{if(EMBEDDED)parent.postMessage({type:'siseon-egg-guide',code:TYPE_CODE,stage},location.origin);};
const SND = ['egg_call', 'knock', 'knockin', 'crack', 'whoosh', 'riser', 'boom', 'chime'];
let master = null, actx = null, buffers = {}, raw = {}, soundOn = new URLSearchParams(location.search).get("sound") !== "off", customBuf = null, customRaw = null;
async function decodeOne(n) {
  if (!actx || buffers[n] || !raw[n]) return;
  try { buffers[n] = await actx.decodeAudioData(raw[n].slice(0)); } catch (e) {}
}
async function fetchSounds() { await Promise.all(SND.map(async n => { try { raw[n] = await (await fetch(n === 'egg_call' ? 'a/egg_call-storybook-v7.wav' : `a/${n}.wav`)).arrayBuffer(); decodeOne(n); } catch (e) {} })); }
async function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createDynamicsCompressor(); master.threshold.value = -3; master.knee.value = 2; master.ratio.value = 20; master.attack.value = 0.001; master.release.value = 0.12;
    const mg = actx.createGain(); mg.gain.value = 1.0; master.connect(mg).connect(actx.destination);
    await Promise.all(SND.map(decodeOne));
    if (customRaw && !customBuf) customBuf = await actx.decodeAudioData(customRaw.slice(0));
  } catch (e) {}
}
function playBuf(b, gain = 1, rate = 1) {
  if (!soundOn || !actx || !b) return;
  const s = actx.createBufferSource(); s.buffer = b; s.playbackRate.value = rate;
  const g = actx.createGain(); g.gain.value = gain * (hostNarrating ? 0.15 : 1); s.connect(g).connect(master || actx.destination); s.start();
}
const play = (n, gain, rate) => playBuf(buffers[n], gain, rate);
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
});

// All spoken game audio uses the host's fixed native narrator.
function unlockSpeech() {}
function sayJjajan() {}
voiceBtn.hidden = true;
voiceFile.disabled = true;

// ---------- state ----------
let st;
function newState() {
  seed = 7;
  const pv = G.pieces.map(([cx, cy]) => {
    const dx = cx - (G.PAD + G.EA), dy = cy - (G.PAD + G.EB) - 20, n = Math.hypot(dx, dy) || 1, sp = rnd(900, 1500);
    return [dx / n * sp, dy / n * sp - rnd(300, 700), rnd(-700, 700)];
  });
  const conf = Array.from({ length: 70 }, () => [rnd(40, 1040), rnd(-500, -20), rnd(90, 220), rnd(0, 6.28),
    ['#ff96a0', '#ffcd64', '#8ccdeb', '#aadca0', '#d2aaf0'][Math.floor(rnd(0, 4.99))], rnd(10, 18)]);
  const spark = Array.from({ length: 14 }, () => [rnd(100, 980), rnd(650, 1650), rnd(0, 6.28), rnd(14, 30)]);
  const beams = Array.from({ length: 16 }, (_, i) => [-Math.PI + 2 * Math.PI * ((i * 7) % 16) / 16 + rnd(-0.12, 0.12), 0.08 + 0.75 * i / 16, rnd(0.6, 1)]);
  return { called: false, callT: -9, callText: null, idleCalled: false, cheer: null, cheerT: -9, p: 0, prog: [], strength: 0, lastTap: -9, hits: 0, hitTimes: [], swing: null, queued: 0, burstT: null, done: false, flakes: [], pops: [], pv, conf, spark, beams, fired: {} };
}
const power = () => st.strength;

function updateHud() {
  cv.dataset.hatchState = st.done ? 'done' : 'playing';
  cv.dataset.typeCode = TYPE_CODE;
  if (st.done && !st.reported) {
    st.reported = true;
    parent.postMessage({type:'siseon-egg-hatched',code:TYPE_CODE},location.origin);
  }
  const n = st.hits;
  fillEl.style.width = (100 * st.p) + '%';
  hintEl.hidden = !(n === 0 || st.done);
  hintEl.parentElement.classList.toggle('up', st.done);
  if (st.done) { hintEl.textContent = '다시 하려면 화면을 눌러요'; hitBtn.textContent = '다시 하기'; hitBtn.classList.add('again'); return; }
  hitBtn.classList.remove('again'); hitBtn.textContent = '콩! 두드리기';
  if (st.burstT !== null) hintEl.textContent = '짜잔!';
  else if (n === 0) hintEl.textContent = st.called ? '망치로 콩콩 두드려서 꺼내 주세요!' : '알 속에서 누가 불러요! 알을 눌러 보세요';
  else hintEl.textContent = '더 세게! 더 빨리!';
}

// ---------- swing: every tap is its own swing, starting from wherever the hammer is ----------
const UP = 0.12, DOWN = 0.08, CONTACT = UP + DOWN, FOLLOW = 0.05, BACK = 0.32;
const REST_A = 3, REST_B = 6;
function restPose(now) { return [REST_A + 1.5 * Math.sin(now * 2.2), REST_B + 2.5 * Math.sin(now * 2.2 + 0.6)]; }
function upPose(s) { return [8 + 18 * s, 16 + 38 * s]; }
function curPose(now) { const [A, B] = armState(now); return [A, B]; }

function tap(e) {
  const now = nowS();
  if (st.done) { st = newState(); updateHud(); return; }
  if (st.burstT !== null) return;
  if (!st.called) { st.called = true; callOut(now, INTRO); updateHud(); return; }
  // how hard: fast taps (and a firm press where the screen reports pressure) lift the hammer higher
  const dt = now - st.lastTap; st.lastTap = now;
  let s = clamp((0.9 - dt) / 0.65);
  if (e && e.pointerType === 'touch' && e.pressure > 0 && e.pressure !== 0.5) s = Math.max(s, clamp(e.pressure * 1.3));
  st.strength = clamp(st.strength * 0.5 + s * 0.6);
  if (st.swing && !st.swing.hit) { st.queued = Math.min(st.queued + 1, 2); return; }
  startSwing(now);
}
function startSwing(now) {
  const [A0, B0] = curPose(now);
  st.swing = { t0: now, A0, B0, s: power(), hit: false };
  play('whoosh', 0.25 + 0.6 * power(), 1.2);
}
async function press(e) {
  cv.dataset.inputCount=String(Number(cv.dataset.inputCount||0)+1);
  if (e) e.preventDefault();
  unlockSpeech();
  hitBtn.classList.add('pressed'); setTimeout(() => hitBtn.classList.remove('pressed'), 90);
  tap(e);
  ensureAudio();
}
hitBtn.addEventListener('pointerdown', press);
hitBtn.addEventListener('click', e => { if (e.detail === 0) press(e); });   // keyboard activation
cv.addEventListener('pointerdown', press);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') press(e); });

const INTRO = ['알을 톡톡', '두드려 줘!'], MORE = ['더 세게', '쳐 줘~!'];
INTRO.clip = 'egg_call'; MORE.clip = 'egg_more';
function callOut(now, lines) {
  st.callT = now; st.callText = lines;
  ensureAudio().then(() => play('knockin', 1.0));
  // The same narrator as the book, at its original speed.
  if(EMBEDDED)sendGuide(lines===INTRO?'ready':'more');
  else if (lines === INTRO) setTimeout(() => play('egg_call', 1.0), 450);
}
function drawBubble(now) {
  let lines = null, t0 = 0;
  if (st.hits === 0) { lines = INTRO; t0 = st.called ? st.callT : 0.3; }
  else if (now - st.lastTap > 3.5 && st.p < 1) { lines = MORE; t0 = st.lastTap + 3.5; }
  if (!lines) return;
  const s = now - t0, z = backOut(s / 0.3, 2.4), bob = 6 * Math.sin(now * 3);
  const cx = 290, cy = 640 + bob, w = 450, h = 230;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, 70); else ctx.rect(-w / 2, -h / 2, w, h);
  ctx.moveTo(90, h / 2 - 4); ctx.lineTo(185, h / 2 + 95); ctx.lineTo(150, h / 2 - 4);
  ctx.fillStyle = '#fffaf2'; ctx.shadowColor = 'rgba(91,58,36,0.25)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.lineWidth = 6; ctx.strokeStyle = '#c9a27a'; ctx.stroke();
  ctx.fillStyle = '#fffaf2'; ctx.fillRect(92, h / 2 - 10, 54, 14);
  ctx.font = '76px Jua, "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5b3a24'; ctx.fillText(lines[0], 0, -42); ctx.fillStyle = '#ff7a45'; ctx.fillText(lines[1], 0, 46);
  ctx.restore();
}
function insideWobble(now) {
  let w = 0;
  const cs = now - st.callT;
  if (cs >= 0 && cs < 1.6) w += 5 * Math.sin(now * 34) * (1 - cs / 1.6);
  if (st.hits === 0 && !st.called && (now % 3) < 0.6) w += 3 * Math.sin(now * 30);
  return w;
}
const TYPE_CODE = 'PVSB', TYPE_NAME = '갤러리 고양이';
function drawType(s) {
  const b = s - 1.0, n = s - 1.25; if (b <= 0) return;
  const y0 = G.EY + G.EB + 70, y1 = y0 + 120;
  ctx.save(); ctx.translate(G.EX, y0); const zb = backOut(b / 0.35, 2.4); ctx.scale(zb, zb);
  ctx.font = '900 64px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(TYPE_CODE).width + 90, h = 92, r = h / 2;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r);
  ctx.fillStyle = '#fbefe0'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#c9a27a'; ctx.stroke();
  ctx.fillStyle = '#6b4a33'; ctx.fillText(TYPE_CODE, 0, 4);
  ctx.restore();
  if (n <= 0) return;
  ctx.save(); ctx.translate(G.EX, y1); const zn = backOut(n / 0.4, 2.2); ctx.scale(zn, zn);
  ctx.font = '900 104px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 22; ctx.strokeStyle = 'rgba(255,250,242,0.95)'; ctx.strokeText(TYPE_NAME, 0, 0);
  ctx.fillStyle = '#3a2a1e'; ctx.fillText(TYPE_NAME, 0, 0);
  ctx.restore();
}
const WORDS = ['콩!', '쿵!', '쾅!', '번쩍!'];
const CHEER = [
  ['힘내!', '할 수 있어!', '더 세게!', '좋아, 잘한다!'],
  ['좀 더!', '한 번 더!', '더 세게 쾅!', '힘내! 할 수 있어!', '우와, 금이 간다!'],
  ['다 왔어!', '조금만 더!', '한 번 더!', '마지막 힘을 내!']
];
function drawCheer(now) {
  const idle = now - st.lastTap;
  let txt = st.cheer, t0 = st.cheerT;
  if (!txt) return;
  const s = now - t0, z = backOut(s / 0.28, 2.6), wig = 3 * Math.sin(now * 6);
  const big = st.p >= GLOW_AT ? 1.15 : 1;
  ctx.save(); ctx.translate(G.EX, 330); ctx.rotate(rad(wig - 4)); ctx.scale(z * big, z * big);
  ctx.font = '128px Jua, "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 30; ctx.strokeStyle = 'rgba(138,86,49,0.35)'; ctx.strokeText(txt, 0, 10);
  ctx.lineWidth = 22; ctx.strokeStyle = '#fffaf2'; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = st.p >= GLOW_AT ? '#f0a400' : '#ff7a45'; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function onContact(now) {
  const k = st.hits; st.hits++; st.hitTimes.push(now);
  const s = st.swing ? st.swing.s : power();
  const amt = (2 + 2 * s) / NEED; st.p = Math.min(1, st.p + amt); st.prog.push([now, amt]);
  // mallet: soft at first, louder and deeper as the egg breaks (a fast hit adds a little more)
  const loud = 2.2 + 3.5 * st.p + 0.8 * s;
  play('knock', loud, 1.15 - 0.3 * st.p + 0.04 * Math.random());
  play('knock', 1.2 + 2.5 * st.p, 0.62);   // deep body thump under every hit
  if (st.p > 0.5) play('boom', 0.5 * (st.p - 0.5) * 2, 1.6);
  if (st.p > 0.06 && st.p < GLOW_AT) play('crack', 0.15 + 0.5 * s, 0.9 + 0.2 * Math.random());
  if (st.p >= GLOW_AT && st.p < 1) { play('crack', 0.8, 1.1); play('chime', 0.35, 0.7 + 1.5 * (st.p - GLOW_AT)); }
  if (k % 3 === 2 && st.p < GLOW_AT)
    st.flakes.push([now, G.TOP[0] - G.PAD - G.EA + rnd(-30, 40), rnd(-80, 160), rnd(-260, -120), rnd(3, 7), rnd(0, 6)]);
  const wi = st.p >= GLOW_AT ? 3 : s > 0.7 ? 2 : s > 0.35 ? 1 : 0;
  st.pops.push([now, WORDS[wi], rnd(-60, 60), 0.6 + 0.6 * s + (wi === 3 ? 0.3 : 0)]);
  if (now - st.cheerT > 0.8 && st.p < 1) {
    const list = st.p < 0.3 ? CHEER[0] : st.p < GLOW_AT ? CHEER[1] : CHEER[2];
    let c; do { c = list[Math.floor(Math.random() * list.length)]; } while (c === st.cheer && list.length > 1);
    st.cheer = c; st.cheerT = now;
  }
  if (st.p >= 1) { st.burstT = now; st.swing = null; st.queued = 0; }
  if (navigator.vibrate) { try { navigator.vibrate(15 + 25 * s); } catch (e) {} }
  updateHud();
}
function armState(now) {
  if (st.burstT !== null) {
    const s = now - st.burstT;
    return [lerp(0, 30, easeOut((s - 0.05) / 0.5)), lerp(-2.4, 30, easeOut((s - 0.05) / 0.4)), 600 * easeIn((s - 0.15) / 0.5), -300 * easeIn((s - 0.15) / 0.5)];
  }
  const sw = st.swing;
  if (!sw) { const [A, B] = restPose(now); return [A, B, 0, 0]; }
  const t = now - sw.t0, [Au, Bu] = upPose(sw.s), f = 1 + 1.4 * sw.s;
  if (t < UP) { const e = easeOut(t / UP); return [lerp(sw.A0, Au, e), lerp(sw.B0, Bu, e), 0, 0]; }
  if (t < CONTACT) { const e = easeIn((t - UP) / DOWN); return [lerp(Au, 0, e), lerp(Bu, 0, e), 0, 0]; }
  if (t < CONTACT + FOLLOW) return [0, -f * Math.sin((t - CONTACT) / FOLLOW * Math.PI / 2), 0, 0];
  const e = easeOut((t - CONTACT - FOLLOW) / BACK), [rA, rB] = restPose(now);
  return [lerp(0, rA, e), lerp(-f, rB, e), 0, 0];
}
function stepSwing(now) {
  const sw = st.swing; if (!sw) return;
  const t = now - sw.t0;
  if (!sw.hit && t >= CONTACT) {
    sw.hit = true; onContact(sw.t0 + CONTACT);
    if (st.burstT !== null) return;
  }
  if (sw.hit && st.queued > 0 && t >= CONTACT + 0.03) { st.queued--; startSwing(now); return; }
  if (t >= CONTACT + FOLLOW + BACK) st.swing = null;
}

// ---------- drawing ----------
let ec, ex, crackLens;
function prepCracks() {
  crackLens = G.cracks.map(([pts]) => { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return L; });
}
function partialPath(c, ci, f, ox, oy) {
  const pts = G.cracks[ci][0], L = crackLens[ci], tot = L[L.length - 1] * f;
  c.beginPath(); c.moveTo(pts[0][0] + ox, pts[0][1] + oy);
  for (let i = 1; i < pts.length; i++) {
    if (L[i] <= tot) c.lineTo(pts[i][0] + ox, pts[i][1] + oy);
    else { const r = (tot - L[i - 1]) / (L[i] - L[i - 1] || 1); c.lineTo(lerp(pts[i - 1][0], pts[i][0], r) + ox, lerp(pts[i - 1][1], pts[i][1], r) + oy); break; }
  }
}
function drawEgg(level, shR, glow) {
  ex.globalCompositeOperation = 'source-over'; ex.globalAlpha = 1;
  ex.clearRect(0, 0, ec.width, ec.height); ex.drawImage(IMG.egg, 0, 0);
  ex.globalCompositeOperation = 'source-atop';
  if (level > 0.5) {
    const f = clamp(level / 8), r = 10 + 10 * f, [tx, ty] = G.TOP;
    ex.save(); ex.translate(tx, ty + 10); ex.scale(1.6, 1);
    const g = ex.createRadialGradient(0, 0, 0, 0, 0, r * 1.6);
    g.addColorStop(0, `rgba(90,60,40,${(40 + 30 * f) / 255})`); g.addColorStop(1, 'rgba(90,60,40,0)');
    ex.fillStyle = g; ex.beginPath(); ex.arc(0, 0, r * 1.6, 0, 7); ex.fill(); ex.restore();
  }
  ex.lineJoin = 'round'; ex.lineCap = 'round';
  G.cracks.forEach(([pts, l0, l1, w], i) => {
    const f = clamp((level - l0) / (l1 - l0)); if (f <= 0) return;
    const ww = w * (0.75 + 0.5 * clamp(level / 8));
    partialPath(ex, i, f, 1.1, 1.4); ex.strokeStyle = 'rgba(255,246,232,0.67)'; ex.lineWidth = ww * 0.9; ex.stroke();
    partialPath(ex, i, f, 0, 0); ex.strokeStyle = 'rgba(78,50,32,0.92)'; ex.lineWidth = ww; ex.stroke();
  });
  if (shR > 0) {
    ex.save(); ex.beginPath(); ex.arc(G.TOP[0], G.TOP[1], shR, 0, 7); ex.clip();
    ex.drawImage(IMG.edge_dark, 0, 0);
    if (glow > 0) { ex.globalAlpha = glow; ex.drawImage(IMG.edge_glow, 0, 0); ex.drawImage(IMG.edge_core, 0, 0); }
    ex.restore();
  }
}
function drawArm(A, B, dx, dy) {
  const E = [G.ELBOW[0] + dx, G.ELBOW[1] + dy], [gx, gy] = rot(-G.FA, 0, A);
  ctx.save(); ctx.translate(E[0], E[1]); ctx.rotate(rad(A)); ctx.drawImage(IMG.arm, -G.apiv[0], -G.apiv[1]); ctx.restore();
  ctx.save(); ctx.translate(E[0] + gx, E[1] + gy); ctx.rotate(rad(A + B)); ctx.drawImage(IMG.hammer, -G.hpiv[0], -G.hpiv[1]); ctx.restore();
}
function star(x, y, r, col, ph) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.42 : r, a = ph + i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function radialGlow(x, y, R, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(255,240,190,${0.92 * alpha})`); g.addColorStop(0.55, `rgba(255,236,170,${0.35 * alpha})`); g.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = g; ctx.fillRect(x - R, y - R, 2 * R, 2 * R);
}
function drawBeams(glow, cx, cy, spin) {
  ctx.save(); ctx.lineCap = 'round';
  for (const [a, thr, wf] of st.beams) {
    const on = clamp((glow - thr) / 0.15); if (on <= 0) continue;
    const a2 = a + spin, L = 1700 * on, dx = Math.cos(a2), dy = Math.sin(a2), px = -dy, py = dx;
    const sx = cx + dx * 60, sy = cy + dy * 80, w0 = 5, w1 = 30 * wf;
    ctx.shadowColor = 'rgba(255,190,60,0.9)'; ctx.shadowBlur = 28;
    ctx.beginPath(); ctx.moveTo(sx + px * w0, sy + py * w0); ctx.lineTo(sx + dx * L + px * w1, sy + dy * L + py * w1);
    ctx.lineTo(sx + dx * L - px * w1, sy + dy * L - py * w1); ctx.lineTo(sx - px * w0, sy - py * w0); ctx.closePath();
    ctx.fillStyle = `rgba(255,196,60,${0.82 * on})`; ctx.fill();
    ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(255,255,230,1)';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + dx * L, sy + dy * L);
    ctx.strokeStyle = `rgba(255,255,245,${on})`; ctx.lineWidth = 5 + 6 * wf; ctx.stroke();
  }
  ctx.restore();
}
function drawRays(s, cx, cy) {
  const n = 18, R = 1500 * (0.5 + 0.5 * easeOut(s / 0.5)), ra = 0.75 + 0.25 * Math.sin(s * 3);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rad(s * 14)); ctx.globalAlpha = ra;
  for (let i = 0; i < n; i++) {
    const a0 = 2 * Math.PI * i / n, w = Math.PI / n * (i % 2 ? 0.55 : 0.9);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    const c = i % 2 ? '255,250,220' : '255,236,160', al = i % 2 ? 0.43 : 0.59;
    g.addColorStop(0, `rgba(${c},${al})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(R * Math.cos(a0 - w / 2), R * Math.sin(a0 - w / 2)); ctx.lineTo(R * Math.cos(a0 + w / 2), R * Math.sin(a0 + w / 2)); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawPops(now) {
  st.pops = st.pops.filter(p => now - p[0] < 0.7);
  for (const [t0, w, dx, sc] of st.pops) {
    const s = now - t0, a = 1 - clamp((s - 0.35) / 0.35), z = sc * backOut(s / 0.18, 2.4);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(G.HEAD0[0] - 230 + dx, G.EY - G.EB - 60 - 140 * easeOut(s / 0.7)); ctx.scale(z, z); ctx.rotate(rad(-8));
    ctx.font = '96px Jua, "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 16; ctx.strokeStyle = '#fffaf2'; ctx.strokeText(w, 0, 0);
    ctx.fillStyle = w === '번쩍!' ? '#f0a400' : '#ff7a45'; ctx.fillText(w, 0, 0);
    ctx.restore();
  }
}

const VOICE = 0.35;
function frame() {
  const now = nowS();
  stepSwing(now);
  const { EX, EY, EA, EB, PAD, EW, EH, W, H } = G;
  const last = st.hitTimes.length ? st.hitTimes[st.hitTimes.length - 1] : null;
  const since = last !== null ? now - last : 99, s0 = power();
  const bs = st.burstT !== null ? now - st.burstT : -1;

  // crack level from taps 1-24, glow from taps 25-29
  let pd = 0; for (const [h, a] of st.prog) pd += a * easeOut((now - h) / 0.2);
  pd = Math.min(pd, 1);
  const level = 8 * clamp(pd / GLOW_AT), glow = clamp((pd - GLOW_AT) / (1 - GLOW_AT - 0.03));

  let shake = since < 0.2 ? (3 + 7 * s0) * (1 - since / 0.2) : 0;
  if (glow > 0 && bs < 0) shake = Math.max(shake, 1.5 + 5 * glow);
  if (bs >= 0 && bs < 0.5) shake = 18 * (1 - bs / 0.5);
  if (reduce) shake *= 0.25;
  const sx = Math.round(shake * Math.sin(now * 97)), sy = Math.round(shake * Math.cos(now * 83));
  const ox = EX - EA - PAD + sx, oy = EY - EB - PAD + sy;

  ctx.globalAlpha = 1; ctx.drawImage(IMG.bg, 0, 0);
  if (bs < 0) {
    ctx.drawImage(IMG.shadow, G.shadow[0], G.shadow[1]);
    drawEgg(level, glow > 0 ? G.DMAX * 1.2 * clamp(0.25 + glow * 0.9) : 0, glow);
    let sq = 0, wob = 0;
    if (since < 0.9) {
      const amp = 0.006 + 0.014 * s0;
      sq = amp * Math.sin(clamp(since / 0.05) * Math.PI / 2) * Math.exp(-Math.max(0, since - 0.05) * 10) * Math.cos(Math.max(0, since - 0.05) * 32);
      wob = (1.2 + 3 * s0) * Math.exp(-since * 4) * Math.sin(since * 16);
    }
    wob += insideWobble(now);
    ctx.save(); ctx.translate(ox + EW / 2, oy + EH - PAD); ctx.rotate(rad(-wob)); ctx.scale(1 + sq, 1 - sq);
    ctx.drawImage(ec, -EW / 2, -(EH - PAD)); ctx.restore();
    if (glow > 0) { const pg = glow * (0.85 + 0.15 * Math.sin(now * 12)); radialGlow(EX + sx, EY - 40 + sy, 520 * (0.6 + 0.5 * pg), 0.6 * pg); drawBeams(glow, EX + sx, EY - 30 + sy, now * 0.25); }
    for (const [h, x0, vx, vy, sz, ph] of st.flakes) {
      const s = now - h; if (s <= 0 || s > 1.3) continue;
      const x = EX + x0 + vx * s, y = EY - EB + G.TOP[1] - PAD + vy * s + 1500 * s * s; if (y > EY + EB + 10) continue;
      const r = rad(ph * 60 + s * 500);
      ctx.beginPath(); [0, 2.3, 4.2].forEach(q => ctx.lineTo(x + sz * Math.cos(r + q), y + sz * 0.7 * Math.sin(r + q)));
      ctx.closePath(); ctx.fillStyle = '#deba96'; ctx.fill(); ctx.strokeStyle = '#faf4e8'; ctx.lineWidth = 1; ctx.stroke();
    }
  } else {
    const s = bs, cyr = EY - 120;
    if (!st.fired.boom) { st.fired.boom = true; play('boom', 1); }
    if (!st.fired.chime && s > 0.15) { st.fired.chime = true; play('chime', 0.8); }
    if (!st.fired.voice && s > VOICE) { st.fired.voice = true; sayJjajan(); }
    drawRays(s, EX, cyr);
    radialGlow(EX, cyr, 520, 0.75 + 0.25 * Math.sin(s * 4));
    if (s < 1.6) { ctx.save(); ctx.globalAlpha = 1 - clamp((s - 0.6) / 1.0); drawBeams(1, EX, cyr + 90, s * 0.7); ctx.restore(); }
    ctx.drawImage(IMG.shadow, G.shadow[0], G.shadow[1]);
    const p = backOut((s - 0.05) / 0.55, 2.2), scl = 0.35 + 0.65 * p, bob = s > 0.6 ? 10 * Math.sin((s - 0.6) * 5) : 0;
    const hw = IMG.hog.width * scl, hh = IMG.hog.height * scl;
    const hx = EX + 15 - hw / 2, hy = EY + EB - 18 - hh - 40 * Math.sin(clamp(s / 0.6) * Math.PI) + bob * 0.4;
    ctx.drawImage(IMG.hog, hx + sx, hy + sy, hw, hh);
    if (s > 0.3) for (const [px, py, ph, r] of st.spark) { const tw = 0.5 + 0.5 * Math.sin(s * 6 + ph); star(px, py, r * (0.4 + 0.6 * tw), `rgba(255,214,90,${(110 + 145 * tw) / 255})`, s * 1.5 + ph); }
    if (s > 0.25) {
      const c2 = s - 0.25;
      for (const [cx, cy, vy, ph, col, sz] of st.conf) {
        let y = cy + vy * c2 * 2.2; if (y > H + 30) y = ((y + 30) % (H + 560)) - 530;
        const x = cx + 34 * Math.sin(c2 * 3 + ph), w2 = sz * Math.abs(Math.cos(c2 * 5 + ph));
        ctx.fillStyle = col; ctx.fillRect(x - w2 / 2, y - sz / 2, w2, sz);
      }
    }
    if (s < 1.6) {
      G.pieces.forEach(([cx, cy], i) => {
        const [vx, vy, vr] = st.pv[i], x = ox + cx + vx * s, y = oy + cy + vy * s + 2400 * s * s;
        if (y > H + 200) return;
        const im = IMG['p' + i];
        ctx.save(); ctx.globalAlpha = s > 1 ? 1 - (s - 1) / 0.6 : 1; ctx.translate(x, y); ctx.rotate(rad(-vr * s)); ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore();
      });
    }
    const ts = s - VOICE + 0.05;
    if (ts > 0) {
      const sc = backOut(ts / 0.45, 2.6) * 0.95, wig = ts > 0.45 ? 3 * Math.sin(ts * 5) : 0;
      ctx.save(); ctx.translate(EX, 520); ctx.rotate(rad(-wig)); ctx.scale(sc, sc); ctx.drawImage(IMG.text, -IMG.text.width / 2, -IMG.text.height / 2); ctx.restore();
    }
    drawType(s);
    if (s < 0.45) { ctx.fillStyle = `rgba(255,252,240,${0.92 * (1 - s / 0.45) ** 1.5})`; ctx.fillRect(0, 0, W, H); }
    if (!st.done && s > 1.8) { st.done = true; updateHud(); }
  }
  if (bs < 0.8) { const [A, B, dx, dy] = armState(now); drawArm(A, B, dx + sx, dy + sy); }
  if (since < 0.16 && bs < 0) {
    const cx = G.HEAD0[0], cy = EY - EB - 4, r0 = 44 + 36 * since / 0.16, r1 = r0 + 30 + 60 * s0;
    ctx.save(); ctx.strokeStyle = `rgba(255,200,80,${0.9 * (1 - since / 0.16)})`; ctx.lineWidth = 8; ctx.lineCap = 'round';
    for (let i = 0; i < 9; i++) { const a = Math.PI + (i + 0.5) * Math.PI / 9; ctx.beginPath(); ctx.moveTo(cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)); ctx.lineTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)); ctx.stroke(); }
    ctx.restore();
  }
  if (bs < 0) {
    if (st.hits > 0 && now - st.lastTap > 3.5 && !st.idleCalled) { st.idleCalled = true; callOut(now, MORE); }
    if (now - st.lastTap < 3.5) st.idleCalled = false;
    if (st.called && st.hits === 0 && now - st.callT > 6) callOut(now, INTRO);
    drawBubble(now); drawPops(now); drawCheer(now);
  }
  requestAnimationFrame(frame);
}

async function boot() {
  try {
    G = await (await fetch('a/geo.json')).json();
    const names = imgNames.concat(G.pieces.map((_, i) => 'p' + i)).concat(['shadow']);
    const imgs = await loadImages(names);
    names.forEach((n, i) => IMG[n] = imgs[i]);
    ec = document.createElement('canvas'); ec.width = G.EW; ec.height = G.EH; ex = ec.getContext('2d');
    prepCracks();
    try { await Promise.all([document.fonts.load('96px Jua'), document.fonts.load('900 64px "Noto Sans KR"', TYPE_NAME + TYPE_CODE)]); } catch (e) {}
    st = newState(); if(EMBEDDED){st.called=true;st.callT=nowS();} updateHud();
    sendGuide('ready');
    document.getElementById('loading').hidden = true;
    fetchSounds();
    requestAnimationFrame(frame);
  } catch (e) {
    sendGuide('error');
    const loading=document.getElementById('loading');loading.textContent='그림을 다시 불러올까요?';loading.dataset.loadError=String(e.message||e);
    const retry=document.createElement('button');retry.textContent='다시 불러오기';retry.onclick=()=>location.reload();loading.append(retry);
  }
}

// Embedded storybook lifecycle adapter; the original game and artwork stay intact.
addEventListener('message', e => {
  if(e.origin !== location.origin || e.source !== parent || !e.data || e.data.type !== 'siseon-egg-controls')return;
  soundOn = e.data.sound === true;
  hostNarrating = e.data.narrating === true;
  if(actx && (!soundOn || e.data.paused)) actx.suspend().catch(()=>{});
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && actx)actx.suspend().catch(()=>{});
});
addEventListener('pagehide',()=>{if(actx)actx.close().catch(()=>{});});
boot();
})();
</script>
